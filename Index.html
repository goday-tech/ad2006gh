        // ==========================================
        // 3. STAFF WORKSPACE (Camera & Scanner Flow)
        // ==========================================
        function StaffScannerWorkspace({ isAdminSession, onAddExisting, currentTerminal, products, processAction, processSplitTransfer, departments, workflowStages, requestConfirm, acknowledgeReceipt }) {
          const [scanInput, setScanInput] = useState('');
          const [activeProduct, setActiveProduct] = useState(null);
          const [errorMsg, setErrorMsg] = useState('');
          
          const [actionType, setActionType] = useState('RECEIVE'); 
          const [selectedStage, setSelectedStage] = useState('');
          
          const [qcStatus, setQcStatus] = useState(QC_STATUS.PASSED);
          const [notes, setNotes] = useState('');
          const [isCameraActive, setIsCameraActive] = useState(false);

          const [isSplitMode, setIsSplitMode] = useState(false);
          const [splitDepartments, setSplitDepartments] = useState([]);
          const [splitNote, setSplitNote] = useState('');

          // When a scanned tag belongs to a product that was split into multiple
          // sub-batches (A, B, C...), we can't tell which physical part is in front
          // of the staff just from the tag (it's the same original QR code for all
          // of them) — so we ask them to pick the part instead of guessing.
          const [splitPickerParent, setSplitPickerParent] = useState(null);
          const [selectedReceiveChildren, setSelectedReceiveChildren] = useState([]);

          const isSalesTerminal = currentTerminal.dept === 'Sales Department';
          const isRawMaterialsTerminal = currentTerminal.dept === 'Raw Materials Issued';
          const [customerName, setCustomerName] = useState('');
          const [customerPhone, setCustomerPhone] = useState('');
          const [salePrice, setSalePrice] = useState('');
          const [paymentMethod, setPaymentMethod] = useState('Cash');
          const [salesUnlocked, setSalesUnlocked] = useState(false);
          const salesAccess = salesUnlocked || !!isAdminSession; // the Admin is already verified; staff must enter the Admin password
          const [salesView, setSalesView] = useNavState('SELL'); // Sales Department only: 'SELL' | 'AVAILABLE' | 'SOLD' | 'RECEIPTS' | 'REPORT'
          useBackLayer(!!activeProduct, () => setActiveProduct(null));
          useEffect(() => { if (salesView === 'SELL') setSalesUnlocked(false); }, [salesView]); // protected figures lock again when a new sale starts
          useBackLayer(!!splitPickerParent, () => { setSplitPickerParent(null); setSelectedReceiveChildren([]); });

          useEffect(() => {
            if (!isCameraActive) return;

            let html5QrCode;
            const startScanner = () => {
              html5QrCode = new window.Html5Qrcode("qr-reader");
              html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                  html5QrCode.stop().then(() => {
                    setIsCameraActive(false);
                    processScannedId(decodedText);
                  }).catch(err => console.error("Failed to stop scanner", err));
                },
                (errorMessage) => { }
              ).catch((err) => {
                setErrorMsg("Camera access denied or unavailable. Please use manual entry.");
                setIsCameraActive(false);
              });
            };

            if (!window.Html5Qrcode) {
              const script = document.createElement('script');
              script.src = 'https://unpkg.com/html5-qrcode';
              script.async = true;
              script.onload = startScanner;
              document.body.appendChild(script);
            } else {
              startScanner();
            }

            return () => {
              if (html5QrCode) {
                try { html5QrCode.stop().catch(() => {}); } catch (e) {}
              }
            };
          }, [isCameraActive]);

          const activateProduct = (found) => {
            setActiveProduct(found);
            setScanInput('');
            setSplitPickerParent(null);
            setQcStatus(found.qcStatus === QC_STATUS.REWORK ? QC_STATUS.PASSED : QC_STATUS.PASSED);

            if (isSalesTerminal) {
              // Sales Department has one job: sell the product to a customer and issue a receipt.
              setActionType('TRANSFER');
              setSelectedStage('Customer / Final Consumer');
            } else if (found.currentStage === currentTerminal.dept) {
              setActionType('TRANSFER');
              setSelectedStage('');
            } else {
              setActionType('RECEIVE');
              setSelectedStage('');
            }
            setCustomerName('');
            setCustomerPhone('');
            setSalePrice('');
            setPaymentMethod('Cash');
            setIsSplitMode(false);
            setSplitDepartments([]);
            setSplitNote('');
          };

          const processScannedId = (id) => {
            setErrorMsg('');
            setSplitPickerParent(null);
            setSelectedReceiveChildren([]);
            const formattedId = id.trim().toUpperCase();
            const found = products.find(p => p.id === formattedId);

            if (found) {
              if (found.splitChildren && found.splitChildren.length > 0) {
                // This tag was split into multiple sub-batches after it was printed, so the
                // same original QR code now covers several physical parts. Don't guess which
                // one this is — let the staff pick the part (A, B, C...) themselves.
                setScanInput('');
                setSplitPickerParent(found);
                return;
              }
              activateProduct(found);
            } else {
              setErrorMsg(`Unrecognized Product ID: ${formattedId}`);
            }
          };

          const selectSplitChild = (childId) => {
            const child = products.find(p => p.id === childId);
            if (child) activateProduct(child);
          };

          const toggleReceiveChildSelection = (childId) => {
            setSelectedReceiveChildren(prev => prev.includes(childId) ? prev.filter(id => id !== childId) : [...prev, childId]);
          };

          const receiveSelectedSplitChildren = () => {
            if (selectedReceiveChildren.length === 0) return;
            const idsToReceive = [...selectedReceiveChildren];
            const label = idsToReceive.length === 1 ? idsToReceive[0] : `${idsToReceive.length} parts (${idsToReceive.join(', ')})`;
            requestConfirm(`Confirm receipt of ${label} into ${currentTerminal.dept}?`, () => {
              idsToReceive.forEach(childId => {
                processAction(childId, currentTerminal.dept, {
                  qc: QC_STATUS.PASSED,
                  notes: '',
                  actionName: 'Received in Department',
                  saleInfo: null,
                  actionType: 'RECEIVE'
                });
              });
              setSplitPickerParent(null);
              setSelectedReceiveChildren([]);
            });
          };

          const handleScan = (e) => {
            e.preventDefault();
            processScannedId(scanInput);
          };

          const isSaleConfirmation = isSalesTerminal;

          const submitAction = () => {
            if (actionType === 'TRANSFER' && isSplitMode) {
              if (splitDepartments.length < 2) {
                setErrorMsg('Select at least 2 departments to split across, or turn off splitting.');
                return;
              }
              if (qcStatus === QC_STATUS.REWORK && !notes.trim()) {
                setErrorMsg('Notes are mandatory when flagging for rework.');
                return;
              }
              const splitConfirmMsg = `Split ${activeProduct.id} into ${splitDepartments.length} sub-batches — one to each of: ${splitDepartments.join(', ')}?`;
              requestConfirm(splitConfirmMsg, () => {
                processSplitTransfer(activeProduct.id, splitDepartments, { qc: qcStatus, notes, splitNote: splitNote.trim() });
                setActiveProduct(null);
                setNotes('');
                setQcStatus(QC_STATUS.PASSED);
                setIsSplitMode(false);
                setSplitDepartments([]);
                setSplitNote('');
              });
              return;
            }

            let finalStage = selectedStage;
            let actionName = '';

            if (actionType === 'RECEIVE') {
              finalStage = currentTerminal.dept;
              actionName = isRawMaterialsTerminal ? 'Raw Materials Issued' : 'Received in Department';
            } else {
              if (!selectedStage) {
                setErrorMsg('Please select a valid next destination stage.');
                return;
              }
              actionName = 'Processing Complete - Transferred';
            }

            if (!isSaleConfirmation && qcStatus === QC_STATUS.REWORK && !notes.trim()) {
              setErrorMsg('Notes are mandatory when flagging for rework.');
              return;
            }

            let saleInfo = null;
            if (isSaleConfirmation) {
              if (!customerName.trim()) {
                setErrorMsg('Customer name is required to confirm a sale.');
                return;
              }
              const priceNum = parseFloat(salePrice);
              if (isNaN(priceNum) || priceNum <= 0) {
                setErrorMsg('Please enter a valid sale amount (GHS).');
                return;
              }
              const receiptNo = `RCPT-${activeProduct.id.replace('PRD-', '')}-${Date.now().toString().slice(-5)}`;
              saleInfo = {
                receiptNo,
                customerName: customerName.trim(),
                customerPhone: customerPhone.trim(),
                salePrice: priceNum,
                paymentMethod,
                notes: notes.trim(),
                terminal: currentTerminal.name,
                soldAt: new Date().toISOString()
              };
              actionName = 'Sale Confirmed - Receipt Issued';
            }

            let confirmMsg = `Confirm: ${actionName} for ${activeProduct.id}?`;
            if (qcStatus === QC_STATUS.SCRAP) {
              confirmMsg = `Are you sure you want to SCRAP product ${activeProduct.id}? This cannot be undone.`;
            } else if (qcStatus === QC_STATUS.REWORK) {
              confirmMsg = `Are you sure you want to flag product ${activeProduct.id} for REWORK?`;
            } else if (saleInfo) {
              confirmMsg = `Confirm sale of ${activeProduct.id} to "${saleInfo.customerName}" for GHS ${saleInfo.salePrice.toFixed(2)}? A receipt will be issued.`;
            } else if (actionType === 'RECEIVE') {
              confirmMsg = isRawMaterialsTerminal
                ? `Confirm materials issued for ${activeProduct.id}${activeProduct.material ? ` (${activeProduct.material})` : ''}?`
                : `Confirm receipt of product ${activeProduct.id} into ${currentTerminal.dept}?`;
            } else {
              confirmMsg = `Confirm transfer of product ${activeProduct.id} to "${finalStage}"?`;
            }

            requestConfirm(confirmMsg, () => {
              processAction(activeProduct.id, finalStage, { qc: qcStatus, notes, actionName, saleInfo, actionType });

              if (saleInfo) {
                printSalesReceipt(activeProduct, saleInfo);
              }

              if (isRawMaterialsTerminal && actionType === 'RECEIVE' && qcStatus !== QC_STATUS.SCRAP) {
                // Materials issued — move straight into picking the destination department, no need to rescan.
                setActiveProduct(prev => prev ? { ...prev, currentStage: finalStage } : prev);
                setActionType('TRANSFER');
                setSelectedStage('');
                setNotes('');
                setQcStatus(QC_STATUS.PASSED);
              } else {
                setActiveProduct(null);
                setNotes('');
                setQcStatus(QC_STATUS.PASSED);
                setCustomerName('');
                setCustomerPhone('');
                setSalePrice('');
                setPaymentMethod('Cash');
              }
            });
          };

          const [showInbox, setShowInbox] = useState(false);
          const deptDelays = useMemo(
            () => getDelayedProducts(products, departments).filter(m => m.department === currentTerminal.dept),
            [products, currentTerminal.dept, departments]
          );

          const [showPendingReceipt, setShowPendingReceipt] = useState(false);
          const deptPendingReceipt = useMemo(
            () => getPendingReceiptProducts(products, departments).filter(m => m.department === currentTerminal.dept),
            [products, currentTerminal.dept, departments]
          );

          const validDestinations = activeProduct ? workflowStages.filter(stage => {
            if (stage === currentTerminal.dept) return false; 
            if (departments.includes(stage)) {
              if (activeProduct.currentStage === 'Product Created') return false; // Raw Materials Issued must happen first
              return activeProduct.allocations && !!activeProduct.allocations[stage];
            }
            return true; 
          }) : [];

          const splittableDepartments = validDestinations.filter(stage => departments.includes(stage));

          const toggleSplitDepartment = (dept) => {
            setSplitDepartments(prev => prev.includes(dept) ? prev.filter(d => d !== dept) : [...prev, dept]);
          };

          const showSalesRecords = isSalesTerminal && !activeProduct && salesView !== 'SELL';
          return (
            <div className={showSalesRecords ? 'max-w-5xl mx-auto' : 'max-w-3xl mx-auto'}>
              {isSalesTerminal && !activeProduct && (
                <div className="sticky top-16 z-40 bg-slate-50 pt-1 pb-4 -mt-1 mb-2 no-print">
                <div className="flex items-center gap-1 bg-white p-1 rounded-2xl border border-slate-200 shadow-sm overflow-x-auto">
                  {[['SELL', 'New Sale', 'Sell', ScanLine], ['AVAILABLE', 'Available', 'Stock', Package], ['SOLD', 'Sold', 'Sold', CheckCircle2], ['RECEIPTS', 'Receipts Issued', 'Receipts', FileText], ['REPORT', 'Sales Report', 'Report', BarChart3]].map(([key, label, short, TabIcon]) => (
                    <button
                      key={key}
                      onClick={() => setSalesView(key)}
                      className={`flex-1 flex items-center justify-center gap-1 sm:gap-1.5 px-2 sm:px-3 py-2.5 rounded-xl text-[11px] sm:text-sm font-bold transition-colors whitespace-nowrap ${salesView === key ? 'bg-black text-white' : 'text-slate-500 hover:text-slate-800 hover:bg-slate-50'}`}
                    >
                      <TabIcon className="w-4 h-4" /> <span className="hidden sm:inline">{label}</span><span className="sm:hidden">{short}</span>
                    </button>
                  ))}
                </div>
                </div>
              )}
              {showSalesRecords ? (
                <SalesRecordsWorkspace products={products} view={salesView} onAddExisting={onAddExisting} unlocked={salesAccess} onUnlock={() => setSalesUnlocked(true)} onLock={() => setSalesUnlocked(false)} canLock={!isAdminSession} onSell={(id) => { setSalesView('SELL'); processScannedId(id); }} />
              ) : !activeProduct ? (
                <React.Fragment>
                {splitPickerParent && (
                  <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-300 text-center mb-6">
                    <div className="w-16 h-16 bg-slate-100 text-black rounded-full flex items-center justify-center mx-auto mb-4">
                      <GitBranch className="w-8 h-8" />
                    </div>
                    <h2 className="text-xl font-bold text-slate-800">Which part did you receive?</h2>
                    <p className="text-slate-500 mt-2 max-w-sm mx-auto text-sm">
                      <span className="font-mono font-bold text-black">{splitPickerParent.id}</span> was split into {splitPickerParent.splitChildren.length} parts using this same tag. Tick every part you have in hand, or tap one to open it individually.
                    </p>
                    {splitPickerParent.splitNote && (
                      <p className="mt-3 max-w-sm mx-auto text-xs italic text-black bg-slate-100 border border-slate-300 rounded-xl px-3 py-2 flex items-start gap-2 text-left">
                        <StickyNote className="w-3.5 h-3.5 flex-shrink-0 mt-0.5" /> "{splitPickerParent.splitNote}"
                      </p>
                    )}
                    <div className="mt-6 space-y-3 max-w-md mx-auto text-left">
                      {splitPickerParent.splitChildren.map(childId => {
                        const child = products.find(p => p.id === childId);
                        if (!child) return null;
                        const isReceivable = child.pendingReceipt && child.currentStage === currentTerminal.dept;
                        const isChecked = selectedReceiveChildren.includes(childId);
                        return (
                          <div
                            key={childId}
                            className={`w-full flex items-center gap-3 p-4 rounded-2xl border-2 transition-colors ${isChecked ? 'border-black bg-slate-100' : 'border-slate-200'}`}
                          >
                            {isReceivable && (
                              <input
                                type="checkbox"
                                checked={isChecked}
                                onChange={() => toggleReceiveChildSelection(childId)}
                                className="w-5 h-5 flex-shrink-0 accent-black cursor-pointer"
                              />
                            )}
                            <button
                              onClick={() => selectSplitChild(childId)}
                              className="flex-1 flex items-center justify-between gap-3 text-left"
                            >
                              <div className="flex items-center gap-3">
                                <span className="w-10 h-10 flex-shrink-0 rounded-full bg-black text-white font-bold flex items-center justify-center">{child.splitLabel}</span>
                                <div>
                                  <p className="font-bold text-sm text-slate-800">Part {child.splitLabel} <span className="font-mono text-xs text-slate-400">({childId})</span></p>
                                  <p className="text-xs text-slate-500 mt-0.5">{child.currentStage}{child.pendingReceipt ? ' · Awaiting receipt' : ' · Already actioned'}</p>
                                </div>
                              </div>
                              <ChevronRight className="w-5 h-5 text-slate-300 flex-shrink-0" />
                            </button>
                          </div>
                        );
                      })}
                    </div>
                    {selectedReceiveChildren.length > 0 && (
                      <button
                        onClick={receiveSelectedSplitChildren}
                        className="mt-6 w-full max-w-md mx-auto flex items-center justify-center gap-2 bg-black hover:bg-slate-800 text-white py-4 rounded-2xl font-bold text-lg transition-colors shadow-lg shadow-black/20"
                      >
                        <CheckCircle2 className="w-5 h-5" /> Receive {selectedReceiveChildren.length} Selected Part{selectedReceiveChildren.length !== 1 ? 's' : ''}
                      </button>
                    )}
                    <button
                      onClick={() => { setSplitPickerParent(null); setSelectedReceiveChildren([]); }}
                      className="mt-6 text-xs font-bold text-slate-400 hover:text-slate-600 uppercase tracking-wider block mx-auto"
                    >
                      Otherwise — none of these / enter code manually
                    </button>
                  </div>
                )}
                {!splitPickerParent && deptPendingReceipt.length > 0 && (
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-300 mb-6 overflow-hidden">
                    <button
                      onClick={() => setShowPendingReceipt(!showPendingReceipt)}
                      className="w-full flex items-center justify-between p-4 bg-slate-100 hover:bg-slate-200 transition-colors"
                    >
                      <div className="flex items-center gap-3">
                        <div className="p-2 bg-slate-200 text-black rounded-lg"><Inbox className="w-5 h-5" /></div>
                        <div className="text-left">
                          <p className="font-bold text-slate-800 text-sm">Pending Receipt</p>
                          <p className="text-xs text-slate-500">{deptPendingReceipt.length} product{deptPendingReceipt.length !== 1 ? 's' : ''} transferred to {currentTerminal.dept}, awaiting acknowledgement</p>
                        </div>
                      </div>
                      <ChevronRight className={`w-5 h-5 text-slate-400 transition-transform ${showPendingReceipt ? 'rotate-90' : ''}`} />
                    </button>
                    {showPendingReceipt && (
                      <div className="p-4 space-y-3 animate-in fade-in">
                        {deptPendingReceipt.map(msg => (
                          <div key={msg.id} className="p-3 rounded-xl border border-slate-300 bg-slate-100 flex items-start justify-between gap-3">
                            <div className="flex items-start gap-3">
                              <Inbox className="w-5 h-5 text-black flex-shrink-0 mt-0.5" />
                              <div>
                                <p className="font-bold text-sm text-slate-800"><span className="font-mono text-black">{msg.product.id}</span> — {msg.product.name}</p>
                                <p className="text-xs text-slate-600 mt-1">Transferred {new Date(msg.transferredAt).toLocaleString()}</p>
                                <p className="text-xs text-slate-500 mt-1">Batch {msg.product.batchNo} · Priority: {msg.product.priority}</p>
                              </div>
                            </div>
                            <button
                              onClick={() => requestConfirm(`Confirm receipt of ${msg.product.id} in ${currentTerminal.dept}?`, () => acknowledgeReceipt(msg.product.id))}
                              className="flex-shrink-0 px-3 py-1.5 bg-black hover:bg-slate-800 text-white rounded-lg text-xs font-bold transition-colors"
                            >
                              Acknowledge
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
                {!splitPickerParent && deptDelays.length > 0 && (
                  <div className="bg-white rounded-2xl shadow-sm border border-orange-200 mb-6 overflow-hidden">
                    <button
                      onClick={() => setShowInbox(!showInbox)}
                      className="w-full flex items-center justify-between p-4 bg-orange-50 hover:bg-orange-100 transition-colors"
                    >
                      <div className="flex items-center gap-3">
                        <div className="p-2 bg-orange-100 text-orange-600 rounded-lg"><Inbox className="w-5 h-5" /></div>
                        <div className="text-left">
                          <p className="font-bold text-slate-800 text-sm">Department Inbox</p>
                          <p className="text-xs text-slate-500">{deptDelays.length} product{deptDelays.length !== 1 ? 's' : ''} delayed in {currentTerminal.dept}</p>
                        </div>
                      </div>
                      <ChevronRight className={`w-5 h-5 text-orange-400 transition-transform ${showInbox ? 'rotate-90' : ''}`} />
                    </button>
                    {showInbox && (
                      <div className="p-4 space-y-3 animate-in fade-in">
                        {deptDelays.map(msg => (
                          <div key={msg.id} className="p-3 rounded-xl border border-orange-200 bg-orange-50 flex items-start gap-3">
                            <AlertTriangle className="w-5 h-5 text-orange-600 flex-shrink-0 mt-0.5" />
                            <div>
                              <p className="font-bold text-sm text-slate-800"><span className="font-mono text-black">{msg.product.id}</span> — {msg.product.name}</p>
                              <p className="text-xs text-slate-600 mt-1">{msg.daysInDept.toFixed(1)}d spent vs {msg.allocatedDays}d allocated (<span className="text-red-600 font-bold">{msg.daysOverdue.toFixed(1)}d overdue</span>)</p>
                              <p className="text-xs text-slate-500 mt-1">Batch {msg.product.batchNo} · Priority: {msg.product.priority}</p>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
                {!splitPickerParent && (
                <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 text-center">
                  <div className="mb-8">
                    <div className="w-24 h-24 bg-slate-100 text-black rounded-full flex items-center justify-center mx-auto mb-6">
                      <ScanLine className="w-12 h-12" />
                    </div>
                    <h2 className="text-2xl font-bold text-slate-800">Scan Product Label</h2>
                    <p className="text-slate-500 mt-2 max-w-sm mx-auto">Scan the product tag to log operations or update location.</p>
                  </div>

                  {errorMsg && (
                    <div className="mb-6 p-4 bg-red-50 text-red-700 rounded-xl flex items-center justify-center gap-2 font-medium">
                      <AlertCircle className="w-5 h-5" /> {errorMsg}
                    </div>
                  )}

                  {isCameraActive ? (
                    <div className="mb-8 max-w-md mx-auto">
                      <div id="qr-reader" className="w-full overflow-hidden rounded-2xl border-4 border-slate-700 mb-4 bg-slate-900 min-h-[300px]"></div>
                      <button 
                        onClick={() => setIsCameraActive(false)}
                        className="w-full bg-white border-2 border-black hover:bg-slate-100 text-black py-3 rounded-xl font-bold transition-colors"
                      >
                        Cancel Camera Scan
                      </button>
                    </div>
                  ) : (
                    <div className="mb-8 max-w-md mx-auto">
                      <button 
                        onClick={() => setIsCameraActive(true)}
                        className="w-full bg-black hover:bg-slate-800 text-white py-4 rounded-2xl font-bold text-lg transition-colors flex justify-center items-center gap-3 shadow-lg shadow-black/20"
                      >
                        <MonitorSmartphone className="w-6 h-6" /> Open Camera to Scan
                      </button>
                    </div>
                  )}

                  <div className="relative mb-6 max-w-md mx-auto">
                    <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-slate-200"></div></div>
                    <div className="relative flex justify-center text-sm"><span className="px-4 bg-white text-slate-400 font-bold uppercase tracking-wider">Or enter manually</span></div>
                  </div>

                  <form onSubmit={handleScan} className="max-w-md mx-auto">
                    <div className="relative">
                      <input 
                        type="text" 
                        value={scanInput}
                        onChange={e => setScanInput(e.target.value)}
                        placeholder="Enter Product ID manually..."
                        className="w-full p-4 pl-12 border-2 border-slate-200 rounded-2xl focus:border-slate-700 focus:ring-4 focus:ring-slate-100 outline-none text-lg font-mono uppercase text-center tracking-widest transition-all shadow-inner"
                      />
                      <QrCode className="w-6 h-6 absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400" />
                    </div>
                    <button type="submit" className="w-full mt-4 bg-slate-900 text-white py-4 rounded-2xl font-bold text-lg hover:bg-slate-800 transition-colors shadow-lg shadow-slate-900/20">
                      Process Entry
                    </button>
                  </form>
                </div>
                )}
                </React.Fragment>
              ) : (
                <div className="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden">
                  
                  <div className="bg-slate-900 p-6 text-white relative overflow-hidden">
                    <div className="absolute top-0 right-0 p-8 opacity-10"><Package className="w-32 h-32" /></div>
                    <div className="relative z-10">
                      <div className="flex items-center gap-3 mb-2">
                        <h2 className="text-3xl font-mono font-bold tracking-tight">{activeProduct.id}</h2>
                        {activeProduct.priority === 'Urgent' && <span className="bg-red-500 text-white px-2 py-0.5 rounded text-xs font-bold animate-pulse">URGENT</span>}
                      </div>
                      <h3 className="text-xl text-slate-300 font-medium mb-4">{activeProduct.name}</h3>
                      
                      <div className="grid grid-cols-2 gap-4 text-sm bg-white/10 p-4 rounded-xl backdrop-blur-sm">
                        <div><span className="block text-slate-400 text-xs uppercase mb-1">Batch</span><span className="font-mono">{activeProduct.batchNo}</span></div>
                        <div>
                          <span className="block text-slate-400 text-xs uppercase mb-1">Current Loc</span>
                          <span className={`${activeProduct.currentStage === currentTerminal.dept ? 'text-green-300 font-bold' : ''}`}>
                            {activeProduct.currentStage}
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="p-6 md:p-8 space-y-8">
                    {errorMsg && <div className="p-4 bg-red-50 text-red-700 rounded-xl text-sm font-medium flex gap-2"><AlertCircle className="w-5 h-5"/> {errorMsg}</div>}

                    {/* Step 1: Operation Type (Sales Department sells directly — no receive/transfer choice needed) */}
                    {!isSalesTerminal && (
                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-3 uppercase tracking-wider">1. Operation Type</label>
                        <div className="flex flex-col sm:flex-row gap-4">
                          <button 
                            onClick={() => { setActionType('RECEIVE'); setIsSplitMode(false); setSplitDepartments([]); setSplitNote(''); }} 
                            className={`flex-1 py-4 px-4 rounded-xl font-bold border-2 transition-all flex items-center justify-center gap-2 ${actionType === 'RECEIVE' ? 'border-slate-700 bg-slate-100 text-black shadow-sm' : 'border-slate-200 text-slate-500 hover:border-slate-300'}`}
                          >
                            <LogIn className="w-5 h-5" /> Receive Product
                          </button>
                          <button 
                            onClick={() => setActionType('TRANSFER')} 
                            className={`flex-1 py-4 px-4 rounded-xl font-bold border-2 transition-all flex items-center justify-center gap-2 ${actionType === 'TRANSFER' ? 'border-black bg-slate-100 text-black shadow-sm' : 'border-slate-200 text-slate-500 hover:border-slate-300'}`}
                          >
                            <Send className="w-5 h-5" /> Transfer / Leave
                          </button>
                        </div>
                      </div>
                    )}

                    {/* Attached Blueprint Display inside Staff Scanner */}
                    {activeProduct.attachment && (
                      <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl">
                        <h4 className="text-xs font-bold text-slate-600 uppercase mb-3 flex items-center gap-2">
                           {activeProduct.attachmentType === 'pdf' ? <FileText className="w-4 h-4 text-red-500"/> : <Image className="w-4 h-4 text-slate-600"/>} 
                           Attached Blueprint Document ({activeProduct.attachmentType?.toUpperCase()})
                        </h4>
                        <img src={activeProduct.attachment} alt="Blueprint" className="max-h-64 rounded border border-slate-300 mx-auto bg-white" />
                      </div>
                    )}

                    {!isSalesTerminal && actionType === 'RECEIVE' && isRawMaterialsTerminal && (
                      <div className="bg-amber-50 border border-amber-200 p-4 rounded-xl animate-in fade-in slide-in-from-top-4">
                        <h4 className="text-xs font-bold text-amber-800 uppercase mb-3 flex items-center gap-2">
                          <Package className="w-4 h-4" /> Raw Materials Needed
                        </h4>
                        {activeProduct.material ? (
                          <div className="flex flex-wrap gap-2">
                            {activeProduct.material.split(',').map(m => m.trim()).filter(Boolean).map((m, idx) => (
                              <span key={idx} className="bg-white border border-amber-300 text-amber-800 text-sm font-medium px-3 py-1.5 rounded-lg shadow-sm">{m}</span>
                            ))}
                          </div>
                        ) : (
                          <span className="text-sm text-slate-500 italic">No specific materials listed for this product.</span>
                        )}
                        <p className="text-xs text-amber-700 mt-3">Confirm below once these materials have been issued for this job.</p>
                      </div>
                    )}

                    {!isSalesTerminal && actionType === 'RECEIVE' && (
                      <div className="bg-slate-100 border border-slate-200 p-4 rounded-xl animate-in fade-in slide-in-from-top-4">
                        <h4 className="text-xs font-bold text-black uppercase mb-3">Project Target Times &amp; Allocation</h4>
                        <div className="flex flex-wrap gap-2">
                          {activeProduct.allocations && Object.keys(activeProduct.allocations).length > 0 ? (
                             Object.entries(activeProduct.allocations).map(([dept, days]) => (

                    {!isSaleConfirmation && (

                        {isSaleConfirmation ? 'Confirm Sale & Print Receipt' : `Confirm ${actionType === 'RECEIVE' ? (isRawMaterialsTerminal ? 'Materials Issued' : 'Receiving') : (isSplitMode ? 'Split Transfer' : 'Transfer')}`} <ArrowRight className="w-5 h-5" />

        // ==========================================
        // SALES TERMINAL RECORDS: Receipts Issued + Monthly/Yearly Sales Report
        // ==========================================
        // Read / unread / cancel controls shown under every inbox item
        function InboxItemActions({ status, onRead, onUnread, onCancel }) {

              <div className="ml-auto flex items-center gap-2">

                ) : (
                  <button onClick={onRead} className="px-2.5 py-1 text-[11px] font-bold rounded-lg border border-black text-black bg-white hover:bg-slate-100 transition-colors">Mark as read</button>

          );
        }

        // Admin-password gate used by the Sales Department's protected figures
        function SalesUnlockForm({ onUnlock }) {
          const [pw, setPw] = useState('');
          const [err, setErr] = useState('');
          const submit = (e) => {
            e.preventDefault();
            if (checkAdminPassword(pw)) { setPw(''); setErr(''); onUnlock(); }
            else { setErr('Incorrect admin password.'); }
          };
          return (
            <form onSubmit={submit} className="space-y-2">
              <div className="flex flex-col sm:flex-row gap-2">
                <input
                  type="password"
                  value={pw}
                  onChange={e => { setPw(e.target.value); setErr(''); }}
                  placeholder="Admin password"
                  autoComplete="off"
                  required
                  className="flex-1 min-w-0 p-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-700 outline-none bg-white"
                />
                <button type="submit" className="px-4 py-2.5 bg-black hover:bg-slate-800 text-white rounded-xl text-sm font-bold transition-colors flex items-center justify-center gap-1.5">
                  <Lock className="w-4 h-4" /> Unlock
                </button>
              </div>
              {err && <p className="text-xs text-red-600 flex items-center gap-1"><AlertCircle className="w-3.5 h-3.5" />{err}</p>}
            </form>
          );
        }

        function SalesTotalValue({ amount, unlocked, onUnlock, onLock, canLock }) {
          const [asking, setAsking] = useState(false);
          if (unlocked) {
            return (
              <div>
                <p className="text-lg font-bold text-slate-800">GHS {Number(amount).toFixed(2)}</p>
                {canLock && <button onClick={onLock} className="text-[11px] font-bold text-slate-500 hover:text-slate-800 flex items-center gap-1 mt-0.5"><Lock className="w-3 h-3" /> Lock</button>}
              </div>
            );
          }
          return (
            <div>
              <p className="text-lg font-bold text-slate-400 tracking-widest">GHS ••••••</p>
              {!asking ? (
                <button onClick={() => setAsking(true)} className="text-[11px] font-bold text-black hover:text-black flex items-center gap-1 mt-0.5"><Lock className="w-3 h-3" /> Unlock total</button>
              ) : (
                <div className="mt-2 w-64 max-w-full"><SalesUnlockForm onUnlock={() => { setAsking(false); onUnlock(); }} /></div>
              )}
            </div>
          );
        }

        function SalesRecordsInner({ products, view, onTrace, onSell, onAddExisting, unlocked, onUnlock, onLock, canLock }) {
          const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
          const soldProducts = useMemo(() => products.filter(p => p.saleInfo), [products]);

          // ----- Receipts Issued -----
          const [rcSearch, setRcSearch] = useState('');
          const [rcFrom, setRcFrom] = useState('');
          const [rcTo, setRcTo] = useState('');
          const issuedReceipts = useMemo(() => {
            const q = rcSearch.trim().toLowerCase();
            return soldProducts.filter(p => {
              const s = p.saleInfo;
              const matchesSearch = !q ||
                p.id.toLowerCase().includes(q) ||
                p.name.toLowerCase().includes(q) ||
                (s.customerName && s.customerName.toLowerCase().includes(q)) ||
                (s.customerPhone && String(s.customerPhone).toLowerCase().includes(q)) ||
                (s.receiptNo && s.receiptNo.toLowerCase().includes(q));
              const day = (s.soldAt || '').slice(0, 10);
              const afterFrom = !rcFrom || day >= rcFrom;
              const beforeTo = !rcTo || day <= rcTo;
              return matchesSearch && afterFrom && beforeTo;
            }).sort((a, b) => new Date(b.saleInfo.soldAt) - new Date(a.saleInfo.soldAt));
          }, [soldProducts, rcSearch, rcFrom, rcTo]);
          const issuedTotal = issuedReceipts.reduce((sum, p) => sum + Number(p.saleInfo.salePrice || 0), 0);

          // ----- Available Products (in stock at Sales Department, not yet sold) -----
          const [avSearch, setAvSearch] = useState('');
          const availableProducts = useMemo(() => {
            const q = avSearch.trim().toLowerCase();
            return products.filter(p =>
              p.currentStage === 'Sales Department' &&
              !p.saleInfo &&
              p.qcStatus !== QC_STATUS.SCRAP &&
              !(p.splitChildren && p.splitChildren.length > 0)
            ).filter(p => !q ||
              p.id.toLowerCase().includes(q) ||
              p.name.toLowerCase().includes(q) ||
              (p.batchNo && String(p.batchNo).toLowerCase().includes(q)) ||
              (p.material && String(p.material).toLowerCase().includes(q))
            ).sort((a, b) => {
              const ta = a.history && a.history[0] ? new Date(a.history[0].timestamp) : new Date(a.createdAt);
              const tb = b.history && b.history[0] ? new Date(b.history[0].timestamp) : new Date(b.createdAt);
              return tb - ta;
            });
          }, [products, avSearch]);

          // ----- Sold Products (with trace) -----
          const [soSearch, setSoSearch] = useState('');
          const soldList = useMemo(() => {
            const q = soSearch.trim().toLowerCase();
            return soldProducts.filter(p => {
              const s = p.saleInfo;
              return !q ||
                p.id.toLowerCase().includes(q) ||
                p.name.toLowerCase().includes(q) ||
                (p.batchNo && String(p.batchNo).toLowerCase().includes(q)) ||
                (s.customerName && s.customerName.toLowerCase().includes(q)) ||
                (s.receiptNo && s.receiptNo.toLowerCase().includes(q));
            }).sort((a, b) => new Date(b.saleInfo.soldAt) - new Date(a.saleInfo.soldAt));
          }, [soldProducts, soSearch]);
          const soldListTotal = soldList.reduce((sum, p) => sum + Number(p.saleInfo.salePrice || 0), 0);

          // ----- Add existing finished products straight into Sales stock -----
          const emptyAddForm = { name: '', quantity: '1', batchNo: '', material: '', location: '', cost: '' };
          const [showAdd, setShowAdd] = useState(false);
          const [addForm, setAddForm] = useState(emptyAddForm);
          const [addError, setAddError] = useState('');
          const [addedProducts, setAddedProducts] = useState([]);
          const submitAdd = (e) => {
            e.preventDefault();
            const qty = parseInt(addForm.quantity, 10);
            if (!addForm.name.trim()) { setAddError('Enter the product name.'); return; }
            if (!qty || qty < 1 || qty > 200) { setAddError('Quantity must be between 1 and 200.'); return; }
            if (addForm.cost !== '' && (isNaN(Number(addForm.cost)) || Number(addForm.cost) < 0)) { setAddError('Cost must be a positive number.'); return; }
            const created = onAddExisting(addForm, qty);
            setAddedProducts(created);
            setAddForm(emptyAddForm);
            setAddError('');
            setShowAdd(false);
          };

          // ----- Monthly / Yearly Sales Report -----
          const availableYears = useMemo(() => {
            const years = new Set(soldProducts.map(p => new Date(p.saleInfo.soldAt).getFullYear()));
            years.add(new Date().getFullYear());
            return Array.from(years).sort((a, b) => b - a);
          }, [soldProducts]);
          const [reportYear, setReportYear] = useState(new Date().getFullYear());
          const [reportMonth, setReportMonth] = useState('ALL');
          const [isGenerating, setIsGenerating] = useState(false);

          const monthlySalesReport = useMemo(() => {
            const rows = MONTH_NAMES.map((name, idx) => ({ month: idx, name, revenue: 0, units: 0, cost: 0 }));
            soldProducts.forEach(p => {
              const d = new Date(p.saleInfo.soldAt);
              if (d.getFullYear() !== reportYear) return;
              const row = rows[d.getMonth()];
              row.revenue += Number(p.saleInfo.salePrice || 0);
              row.units += 1;
              row.cost += Number(p.cost || 0);
            });
            return rows.map(r => ({ ...r, profit: r.revenue - r.cost }));
          }, [soldProducts, reportYear]);

          const yearTotals = monthlySalesReport.reduce((acc, r) => ({
            revenue: acc.revenue + r.revenue,
            units: acc.units + r.units,
            cost: acc.cost + r.cost,
            profit: acc.profit + r.profit
          }), { revenue: 0, units: 0, cost: 0, profit: 0 });

          const reportFilteredSales = useMemo(() => {
            return soldProducts.filter(p => {
              const d = new Date(p.saleInfo.soldAt);
              if (d.getFullYear() !== reportYear) return false;
              if (reportMonth !== 'ALL' && d.getMonth() !== Number(reportMonth)) return false;
              return true;
            }).sort((a, b) => new Date(b.saleInfo.soldAt) - new Date(a.saleInfo.soldAt));
          }, [soldProducts, reportYear, reportMonth]);

          const periodRevenue = reportMonth === 'ALL' ? yearTotals.revenue : monthlySalesReport[Number(reportMonth)].revenue;
          const periodUnits = reportMonth === 'ALL' ? yearTotals.units : monthlySalesReport[Number(reportMonth)].units;
          const periodLabel = reportMonth === 'ALL' ? `${reportYear}` : `${MONTH_NAMES[Number(reportMonth)]} ${reportYear}`;

          const handleReportAction = async (mode) => {
            setIsGenerating(true);
            const reportParams = { reportYear, reportMonth, monthNames: MONTH_NAMES, monthlySalesReport, yearTotals, transactions: reportFilteredSales };
            try {
              if (mode === 'PRINT') await printSalesReport(reportParams);
              else await downloadSalesReport(reportParams);
            } finally {
              setIsGenerating(false);
            }
          };

          if (view === 'AVAILABLE') {
            return (
              <div className="space-y-4 animate-in fade-in">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div className="p-5 border-b border-slate-100 bg-slate-50 space-y-3">
                    <div>
                      <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <Package className="w-5 h-5 text-black" /> Available Products
                      </h2>
                      <p className="text-xs text-slate-500 mt-1">Products currently in stock at the Sales Department, ready to be sold.</p>
                    </div>
                    <button
                      onClick={() => { setShowAdd(v => !v); setAddError(''); }}
                      className="px-4 py-2 bg-black hover:bg-slate-800 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors"
                    >
                      <Plus className="w-4 h-4" /> {showAdd ? 'Close form' : 'Add Existing Product'}
                    </button>
                    {showAdd && (
                      <form onSubmit={submitAdd} className="p-4 bg-white rounded-xl border border-slate-200 space-y-3">
                        <p className="text-xs text-slate-500">Register a finished product you already have, so it can be sold from the system. Each unit gets its own tag ID.</p>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div className="sm:col-span-2">
                            <label className="block text-xs font-bold text-slate-600 mb-1">Product name *</label>
                            <input type="text" required value={addForm.name} onChange={e => { setAddForm({ ...addForm, name: e.target.value }); setAddError(''); }} placeholder="e.g. Executive Office Desk" className="w-full p-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-700 outline-none" />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-600 mb-1">Quantity *</label>
                            <input type="number" min="1" max="200" required value={addForm.quantity} onChange={e => { setAddForm({ ...addForm, quantity: e.target.value }); setAddError(''); }} className="w-full p-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-700 outline-none" />
                          </div>

        // ==========================================
        // 4. MANAGER WORKSPACE (Analytics)
        // ==========================================
        function ManagerAnalyticsWorkspace({ products, logs, departments, isAdmin, updateProductCost, updateProductWarehouseLocation, requestConfirm, acknowledgeReceipt }) {
          const [editingCostId, setEditingCostId] = useState(null);
          const [costDraft, setCostDraft] = useState('');

          const startEditCost = (p) => {
            setEditingCostId(p.id);
            setCostDraft(p.cost != null ? String(p.cost) : '');

          const saveCost = (productId) => {
            const val = parseFloat(costDraft);
            const finalVal = isNaN(val) ? 0 : val;
            requestConfirm(`Set product cost to GHS ${finalVal.toFixed(2)} for ${productId}?`, () => {
              updateProductCost(productId, finalVal);
              setEditingCostId(null);
            });
          };

          const [editingLocationId, setEditingLocationId] = useState(null);
          const [locationDraft, setLocationDraft] = useState('');

          const startEditLocation = (p) => {
            setEditingLocationId(p.id);
            setLocationDraft(p.warehouseLocation || '');
          };

          const saveLocation = (productId) => {
            const val = locationDraft.trim();
            requestConfirm(val ? `Set warehouse location to "${val}" for ${productId}?` : `Clear warehouse location for ${productId}?`, () => {
              updateProductWarehouseLocation(productId, val);
              setEditingLocationId(null);

          const [activeTab, setActiveTab] = useNavState('DASHBOARD'); 
          const [searchTerm, setSearchTerm] = useState('');
          const [dateFilter, setDateFilter] = useState('');
          const [historyProduct, setHistoryProduct] = useState(null); 
          const activeItemsRef = useRef(null);

          const activeWIP = products.filter(p => 
            !['Finished Product', 'Quality Control & Finished Goods Stock', 'Sales Department', 'Customer / Final Consumer'].includes(p.currentStage) && 
            p.qcStatus !== QC_STATUS.SCRAP &&
            !(p.splitChildren && p.splitChildren.length > 0)
          );
          
          const requireRework = products.filter(p => p.qcStatus === QC_STATUS.REWORK).length;
          const finishedProducts = products.filter(p => ['Finished Product', 'Quality Control & Finished Goods Stock', 'Sales Department', 'Customer / Final Consumer'].includes(p.currentStage));
          const completedSystemWide = finishedProducts.length;
          
          const departmentDistribution = useMemo(() => {
            const stages = [
              { name: 'Raw Materials Issued', fullName: 'Raw Materials Issued' },
              ...departments.map(dept => ({ name: dept.replace(' Department', ''), fullName: dept }))
            ];
            return stages.map(stage => ({
              name: stage.name,
              fullName: stage.fullName,
              count: activeWIP.filter(p => p.currentStage === stage.fullName).length
            }));
          }, [activeWIP, departments]);

          const [deptFilter, setDeptFilter] = useState(null);

          const filteredActiveProducts = activeWIP.filter(p => {
            const matchesSearch = p.id.toLowerCase().includes(searchTerm.toLowerCase()) || p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.batchNo.toLowerCase().includes(searchTerm.toLowerCase());
            const matchesDept = !deptFilter || p.currentStage === deptFilter;
            return matchesSearch && matchesDept;
          });

          const filteredFinishedProducts = finishedProducts.filter(p => {
            const matchesSearch = p.id.toLowerCase().includes(searchTerm.toLowerCase()) || p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.batchNo.toLowerCase().includes(searchTerm.toLowerCase());
            return matchesSearch;
          });

          const filteredLogs = logs.filter(log => {
            const matchesSearch = log.productId.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  (log.productName && log.productName.toLowerCase().includes(searchTerm.toLowerCase()));
            const matchesDate = dateFilter ? log.timestamp.startsWith(dateFilter) : true;
            return matchesSearch && matchesDate;
          });

          const soldProducts = useMemo(() => products.filter(p => p.saleInfo), [products]);

          const filteredSoldProducts = soldProducts.filter(p => {
            const s = p.saleInfo;
            const matchesSearch = p.id.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                  p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                  (s.customerName && s.customerName.toLowerCase().includes(searchTerm.toLowerCase())) ||
                                  (s.receiptNo && s.receiptNo.toLowerCase().includes(searchTerm.toLowerCase()));
            const matchesDate = dateFilter ? (s.soldAt || '').startsWith(dateFilter) : true;
            return matchesSearch && matchesDate;
          }).sort((a, b) => new Date(b.saleInfo.soldAt) - new Date(a.saleInfo.soldAt));

          const totalRevenue = soldProducts.reduce((sum, p) => sum + Number(p.saleInfo.salePrice || 0), 0);
          const totalUnitsSold = soldProducts.length;
          const totalCostOfSold = soldProducts.reduce((sum, p) => sum + Number(p.cost || 0), 0);
          const totalProfit = totalRevenue - totalCostOfSold;
          const avgSalePrice = totalUnitsSold > 0 ? totalRevenue / totalUnitsSold : 0;
          const unitsNotSold = finishedProducts.filter(p => !p.saleInfo).length;

          const paymentMethodBreakdown = useMemo(() => {
            const map = {};
            soldProducts.forEach(p => {
              const method = p.saleInfo.paymentMethod || 'Other';
              map[method] = (map[method] || 0) + Number(p.saleInfo.salePrice || 0);
            });
            return Object.entries(map).map(([method, total]) => ({ method, total }));
          }, [soldProducts]);

          const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

          const availableSalesYears = useMemo(() => {
            const years = new Set(soldProducts.map(p => new Date(p.saleInfo.soldAt).getFullYear()));
            years.add(new Date().getFullYear());
            return Array.from(years).sort((a, b) => b - a);
          }, [soldProducts]);

          const [reportYear, setReportYear] = useState(new Date().getFullYear());
          const [reportMonth, setReportMonth] = useState('ALL');
          const [isGeneratingReport, setIsGeneratingReport] = useState(false);

          const monthlySalesReport = useMemo(() => {
            const rows = MONTH_NAMES.map((name, idx) => ({ month: idx, name, revenue: 0, units: 0, cost: 0 }));
            soldProducts.forEach(p => {
              const d = new Date(p.saleInfo.soldAt);
              if (d.getFullYear() !== reportYear) return;
              const row = rows[d.getMonth()];
              row.revenue += Number(p.saleInfo.salePrice || 0);
              row.units += 1;
              row.cost += Number(p.cost || 0);
            });
            return rows.map(r => ({ ...r, profit: r.revenue - r.cost }));
          }, [soldProducts, reportYear]);

          const yearTotals = monthlySalesReport.reduce((acc, r) => ({
            revenue: acc.revenue + r.revenue,
            units: acc.units + r.units,
            cost: acc.cost + r.cost,
            profit: acc.profit + r.profit
          }), { revenue: 0, units: 0, cost: 0, profit: 0 });

          const reportFilteredSales = useMemo(() => {
            return soldProducts.filter(p => {
              const d = new Date(p.saleInfo.soldAt);
              if (d.getFullYear() !== reportYear) return false;
              if (reportMonth !== 'ALL' && d.getMonth() !== Number(reportMonth)) return false;
              return true;
            }).sort((a, b) => new Date(b.saleInfo.soldAt) - new Date(a.saleInfo.soldAt));
          }, [soldProducts, reportYear, reportMonth]);

          const handleSalesReportAction = async (mode) => {
            setIsGeneratingReport(true);
            const reportParams = {
              reportYear,
              reportMonth,
              monthNames: MONTH_NAMES,
              monthlySalesReport,
              yearTotals,
              transactions: reportFilteredSales
            };
            try {
              if (mode === 'PRINT') {
                await printSalesReport(reportParams);
              } else {
                await downloadSalesReport(reportParams);

            } finally {
              setIsGeneratingReport(false);
