        function App() {
          const [currentTerminal, setCurrentTerminal] = useState(null);
          const [confirmState, setConfirmState] = useState(null);
          const requestConfirm = (message, onConfirm) => setConfirmState({ message, onConfirm });
          useBackLayer(!!confirmState, () => setConfirmState(null));
          const [products, setProducts] = useState(INITIAL_PRODUCTS);
          const [globalLogs, setGlobalLogs] = useState([]);
          const [departments, setDepartments] = useState([...CORE_DEPARTMENTS]);
          const [terminals, setTerminals] = useState([...DEPARTMENT_TERMINALS]);
          const [adminView, setAdminView, setAdminViewRaw] = useNavState('ANALYTICS'); // 'REGISTRATION' | 'ANALYTICS' (Dashboard) | 'INVENTORY'
          const [adminOrigin, setAdminOrigin] = useState(null); // set while the admin is working inside a department terminal
          const inventoryFrameRef = useRef(null);
          const terminalLayerRef = useRef(null);
          const returnToAdminRef = useRef(null);
          const [invTab, setInvTabRaw] = useState(() => {
            try { return localStorage.getItem('matflow_tab') || 'dashboard'; } catch (e) { return 'dashboard'; }
          });
          const invTabRef = useRef(invTab);
          const setInvTab = (t) => {
            const cur = invTabRef.current;
            if (t === cur) return;
            invTabRef.current = t;
            NavBack.push(() => {
              invTabRef.current = cur;
              setInvTabRaw(cur);
              const w = inventoryFrameRef.current && inventoryFrameRef.current.contentWindow;
              if (w) w.postMessage({ source: 'ad2006host', type: 'switch-tab', tab: cur }, '*');
            });
            setInvTabRaw(t);
          };
          const [showInvOptions, setShowInvOptions] = useState(false);
          const invOptionsRef = useRef(null);
          const runInventoryAction = (action) => {
            setShowInvOptions(false);
            const w = inventoryFrameRef.current && inventoryFrameRef.current.contentWindow;
            if (!w) return;
            try { w.__invAction(action); }
            catch (err) { w.postMessage({ source: 'ad2006host', type: 'run', action }, '*'); }
          };
          useEffect(() => { setShowInvOptions(false); }, [adminView]);
          useEffect(() => {
            if (!showInvOptions) return;
            const onDown = (e) => { if (invOptionsRef.current && !invOptionsRef.current.contains(e.target)) setShowInvOptions(false); };
            const onKey = (e) => { if (e.key === 'Escape') setShowInvOptions(false); };
            const onBlur = () => setShowInvOptions(false);
            document.addEventListener('mousedown', onDown);
            document.addEventListener('touchstart', onDown);
            document.addEventListener('keydown', onKey);
            window.addEventListener('blur', onBlur);
            return () => {
              document.removeEventListener('mousedown', onDown);
              document.removeEventListener('touchstart', onDown);
              document.removeEventListener('keydown', onKey);
              window.removeEventListener('blur', onBlur);
            };
          }, [showInvOptions]);
          const [outOfStockItems, setOutOfStockItems] = useState([]);
          const [lowStockItems, setLowStockItems] = useState([]);
          // Inbox item status: no entry = unread, 'read', or 'cancelled' (hidden, can be restored)
          const [inboxStatus, setInboxStatus] = useState(() => {
            try { const r = JSON.parse(localStorage.getItem('ad2006_inbox_status') || '{}'); return r && typeof r === 'object' ? r : {}; } catch (e) { return {}; }
          });
          const [inboxReady, setInboxReady] = useState(false);
          const [showCancelledInbox, setShowCancelledInbox] = useState(false);
          const setItemStatus = (key, status) => setInboxStatus(prev => {
            const next = { ...prev };
            if (status) next[key] = status; else delete next[key];
            return next;
          });
          const [showUnifiedInbox, setShowUnifiedInbox] = useState(false);
          useBackLayer(showUnifiedInbox, () => setShowUnifiedInbox(false));
          const [showPwModal, setShowPwModal] = useState(false);
          useBackLayer(showPwModal, () => setShowPwModal(false));
          const [historyProduct, setHistoryProduct] = useState(null);
          const pendingRestockRef = useRef(null);

          // ----- Stock alarm: beeps for about 12 seconds when materials are low / out of stock -----
          const alarmRef = useRef({ ctx: null });
          const alertedIdsRef = useRef(new Set());
          const stopStockAlarm = () => {
            const a = alarmRef.current;
            if (a.ctx) { try { a.ctx.close(); } catch (e) { /* ignore */ } a.ctx = null; }
          };
          const startStockAlarm = () => {
            stopStockAlarm();
            try {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return;
              const ctx = new AC();
              alarmRef.current.ctx = ctx;
              const resume = () => { try { if (ctx.state === 'suspended') ctx.resume(); } catch (e) { /* ignore */ } };
              resume();
              // Some browsers only allow sound after a tap: start as soon as the next tap / key press happens.
              ['pointerup', 'keydown', 'touchend'].forEach(ev => window.addEventListener(ev, resume, { once: true, capture: true }));
              const t0 = ctx.currentTime + 0.05;
              let last = null;
              for (let i = 0; i < 24; i++) {            // 24 beeps x 0.5 s = 12 seconds
                const start = t0 + i * 0.5;
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'square';
                osc.frequency.value = i % 2 === 0 ? 880 : 1175;
                g.gain.setValueAtTime(0.0001, start);
                g.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
                g.gain.setValueAtTime(0.3, start + 0.22);
                g.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);
                osc.connect(g); g.connect(ctx.destination);
                osc.start(start);
                osc.stop(i === 23 ? start + 0.5 : start + 0.3);
                last = osc;
              }
              last.onended = () => {
                try { ctx.close(); } catch (e) { /* ignore */ }
                if (alarmRef.current.ctx === ctx) alarmRef.current.ctx = null;
              };
            } catch (e) { /* sound unavailable on this device */ }
          };
          useEffect(() => () => stopStockAlarm(), []);
          useEffect(() => {
            const isInboxRole = (t) => !!t && (t.role === ROLES.ADMIN || t.role === ROLES.MANAGER);
            const inboxRole = isInboxRole(currentTerminal) || isInboxRole(adminOrigin); // stays on while the admin visits a department terminal
            if (!inboxRole) { alertedIdsRef.current = new Set(); stopStockAlarm(); return; }
            const ids = [...outOfStockItems.map(m => 'out:' + m.id), ...lowStockItems.map(m => 'low:' + m.id)];
            const fresh = ids.filter(id => !alertedIdsRef.current.has(id));
            alertedIdsRef.current = new Set(ids);
            const audible = fresh.filter(id => !inboxStatus[id]);   // items already read / cancelled stay quiet
            if (audible.length > 0) startStockAlarm();   // on sign-in / refresh, and whenever a material newly runs low or out
          }, [outOfStockItems, lowStockItems, inboxStatus, currentTerminal && currentTerminal.role, !!adminOrigin]);

          const loadOutOfStockFromStorage = () => {
            try {
              const raw = localStorage.getItem('matflow_materials');
              const list = raw ? JSON.parse(raw) : [];
              setOutOfStockItems(Array.isArray(list)
                ? list.filter(m => m && m.stock <= 0).map(m => ({ id: m.id, name: m.name, sku: m.sku, unit: m.unit }))
                : []);
              setLowStockItems(Array.isArray(list)
                ? list.filter(m => m && m.stock > 0 && m.stock <= m.minThreshold).map(m => ({ id: m.id, name: m.name, sku: m.sku, unit: m.unit, stock: m.stock, min: m.minThreshold }))
                : []);
            } catch (e) { /* storage unavailable */ }
          };

          useEffect(() => {
            loadOutOfStockFromStorage();
            setInboxReady(true);
            const handler = (e) => {
              if (!e.data || e.data.source !== 'matflow') return;
              if (e.data.type === 'inbox-count') {
                setOutOfStockItems(Array.isArray(e.data.items) ? e.data.items : []);
                setLowStockItems(Array.isArray(e.data.lowItems) ? e.data.lowItems : []);
              } else if (e.data.type === 'open-inbox') {
                setShowUnifiedInbox(true);
              } else if (e.data.type === 'tab' && typeof e.data.tab === 'string') {
                setInvTab(e.data.tab);
              }
            };
            window.addEventListener('message', handler);
            return () => window.removeEventListener('message', handler);
          }, []);

          const openUnifiedInbox = () => {
            loadOutOfStockFromStorage();
            setShowUnifiedInbox(true);
          };

          const postToInventoryFrame = (message) => {
            const w = inventoryFrameRef.current && inventoryFrameRef.current.contentWindow;
            if (w) { w.postMessage(message, '*'); return true; }
            return false;
          };

          const restockFromInbox = (id) => {
            setShowUnifiedInbox(false);
            if (adminView === 'INVENTORY' && postToInventoryFrame({ source: 'ad2006host', type: 'restock', id })) return;
            pendingRestockRef.current = id;
            setAdminView('INVENTORY');
          };

          const handleInventoryFrameLoad = () => {
            const id = pendingRestockRef.current;
            if (id) {
              pendingRestockRef.current = null;
              postToInventoryFrame({ source: 'ad2006host', type: 'restock', id });
            }
          };

          const delayedMessages = useMemo(() => getDelayedProducts(products, departments), [products, departments]);

          const delayedByDepartment = useMemo(() => {
            return departments.map(dept => ({
              dept,
              messages: delayedMessages.filter(m => m.department === dept)
            })).filter(group => group.messages.length > 0);
          }, [delayedMessages, departments]);

          const pendingReceiptMessages = useMemo(() => getPendingReceiptProducts(products, departments), [products, departments]);

          const pendingReceiptByDepartment = useMemo(() => {
            return departments.map(dept => ({
              dept,
              messages: pendingReceiptMessages.filter(m => m.department === dept)
            })).filter(group => group.messages.length > 0);
          }, [pendingReceiptMessages, departments]);

          const isCancelledKey = (k) => inboxStatus[k] === 'cancelled';
          const visibleOutOfStock = outOfStockItems.filter(m => !isCancelledKey('out:' + m.id));
          const visibleLowStock = lowStockItems.filter(m => !isCancelledKey('low:' + m.id));
          const visiblePendingByDept = pendingReceiptByDepartment
            .map(g => ({ ...g, messages: g.messages.filter(m => !isCancelledKey('pend:' + m.id)) }))
            .filter(g => g.messages.length > 0);
          const visibleDelayedByDept = delayedByDepartment
            .map(g => ({ ...g, messages: g.messages.filter(m => !isCancelledKey('delay:' + m.id)) }))
            .filter(g => g.messages.length > 0);
          const visiblePendingCount = visiblePendingByDept.reduce((n, g) => n + g.messages.length, 0);
          const visibleDelayedCount = visibleDelayedByDept.reduce((n, g) => n + g.messages.length, 0);
          const visibleKeys = [
            ...visibleOutOfStock.map(m => 'out:' + m.id),
            ...visibleLowStock.map(m => 'low:' + m.id),
            ...visiblePendingByDept.flatMap(g => g.messages.map(m => 'pend:' + m.id)),
            ...visibleDelayedByDept.flatMap(g => g.messages.map(m => 'delay:' + m.id))
          ];
          const inboxTotal = visibleKeys.length;                                        // items still in the inbox
          const inboxUnread = visibleKeys.filter(k => inboxStatus[k] !== 'read').length; // shown on the red badge
          const cancelledEntries = [
            ...outOfStockItems.filter(m => isCancelledKey('out:' + m.id)).map(m => ({ key: 'out:' + m.id, label: m.name, sub: 'Out of stock' })),
            ...lowStockItems.filter(m => isCancelledKey('low:' + m.id)).map(m => ({ key: 'low:' + m.id, label: m.name, sub: 'Low stock' })),
            ...pendingReceiptMessages.filter(m => isCancelledKey('pend:' + m.id)).map(m => ({ key: 'pend:' + m.id, label: `${m.product.id} — ${m.product.name}`, sub: `Awaiting receipt in ${m.department}` })),
            ...delayedMessages.filter(m => isCancelledKey('delay:' + m.id)).map(m => ({ key: 'delay:' + m.id, label: `${m.product.id} — ${m.product.name}`, sub: `Delayed in ${m.department}` }))
          ];
          const markAllInboxRead = () => setInboxStatus(prev => {
            const next = { ...prev };
            visibleKeys.forEach(k => { next[k] = 'read'; });
            return next;
          });

          // Forget statuses of items that no longer exist (so a repeat problem shows up as new), and remember the rest
          useEffect(() => {
            if (!inboxReady) return;
            const live = new Set([
              ...outOfStockItems.map(m => 'out:' + m.id),
              ...lowStockItems.map(m => 'low:' + m.id),
              ...pendingReceiptMessages.map(m => 'pend:' + m.id),
              ...delayedMessages.map(m => 'delay:' + m.id)
            ]);
            setInboxStatus(prev => {
              const next = {};
              let changed = false;
              Object.keys(prev).forEach(k => { if (live.has(k)) next[k] = prev[k]; else changed = true; });
              return changed ? next : prev;
            });
          }, [inboxReady, outOfStockItems, lowStockItems, pendingReceiptMessages, delayedMessages]);
          useEffect(() => {
            try { localStorage.setItem('ad2006_inbox_status', JSON.stringify(inboxStatus)); } catch (e) { /* storage unavailable */ }
          }, [inboxStatus]);

          const workflowStages = useMemo(() => ([
            'Product Created',
            'Raw Materials Issued',
            ...departments,
            'Finished Product',
            'Quality Control & Finished Goods Stock',
            'Sales Department',
            'Customer / Final Consumer'
          ]), [departments]);

          const addDepartment = (rawName) => {
            const name = (rawName || '').trim();
            if (!name) return { ok: false, error: 'Department name cannot be empty.' };
            const alreadyExists = departments.some(d => d.toLowerCase() === name.toLowerCase());
            if (alreadyExists) return { ok: false, error: 'That department already exists.' };

            setDepartments(prev => [...prev, name]);

            const slug = name.toUpperCase().replace(/[^A-Z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 12) || `DEPT-${Date.now()}`;
            let terminalId = `TERM-${slug}`;
            setTerminals(prev => {
              let uniqueId = terminalId;
              let n = 2;
              while (prev.some(t => t.id === uniqueId)) {
                uniqueId = `${terminalId}-${n}`;
                n += 1;
              }
              return [...prev, { id: uniqueId, name, role: ROLES.STAFF, dept: name }];
            });

            return { ok: true };
          };

          const removeDepartment = (name) => {
            const inUseAsCurrentStage = products.some(p => p.currentStage === name);
            if (inUseAsCurrentStage) {
              return { ok: false, error: `Cannot delete "${name}" — one or more products are currently sitting in that department.` };
            }
            const inUseAsAllocation = products.some(p => p.allocations && p.allocations[name]);
            if (inUseAsAllocation) {
              return { ok: false, error: `Cannot delete "${name}" — it's part of the routing plan for one or more products.` };
            }

            setDepartments(prev => prev.filter(d => d !== name));
            setTerminals(prev => prev.filter(t => t.dept !== name));

            return { ok: true };
          };

          const setDepartmentPin = (deptName, pin) => {
            const cleanPin = (pin || '').trim();
            setTerminals(prev => prev.map(t => t.dept === deptName ? { ...t, pin: cleanPin || null } : t));
            return { ok: true };
          };

          useEffect(() => {
            const allLogs = products.flatMap(p => 
              p.history.map(h => ({ ...h, productId: p.id, productName: p.name }))
            ).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            setGlobalLogs(allLogs);
          }, [products]);

          const handleLogin = (terminal) => setCurrentTerminal(terminal);
          const handleLogout = () => {
            requestConfirm('Are you sure you want to sign out?', () => {
              NavBack.reset();
              setShowUnifiedInbox(false);
              setCurrentTerminal(null);
              setAdminOrigin(null);
              setAdminViewRaw('ANALYTICS');
            });
          };

          const openTerminalAsAdmin = (terminal) => {
            if (!currentTerminal || currentTerminal.role !== ROLES.ADMIN) return;
            setShowUnifiedInbox(false);
            setAdminOrigin(currentTerminal);
            setCurrentTerminal(terminal);
            NavBack.kill(terminalLayerRef.current);
            terminalLayerRef.current = NavBack.push(() => { if (returnToAdminRef.current) returnToAdminRef.current(); });
          };

          const returnToAdmin = () => {
            if (!adminOrigin) return;
            NavBack.kill(terminalLayerRef.current);
            setShowUnifiedInbox(false);
            setCurrentTerminal(adminOrigin);
            setAdminOrigin(null);
            setAdminViewRaw('REGISTRATION');
          };
          returnToAdminRef.current = returnToAdmin;

          const registerProduct = (details, allocations, attachmentDataUrl, attachmentType) => {
            const nextNum = products.length + 1;
            const newId = `PRD-2026-${nextNum.toString().padStart(4, '0')}`;
            const timestamp = new Date().toISOString();
            
            const newProduct = {
              id: newId,
              ...details,
              allocations, 
              attachment: attachmentDataUrl,
              attachmentType: attachmentType, // 'image' or 'pdf'
              currentStage: workflowStages[0],
              qcStatus: QC_STATUS.PASSED,
              createdAt: timestamp,
              history: [{
                id: Date.now(),
                stage: workflowStages[0],
                action: 'System Registration',
                terminal: currentTerminal.name,
                timestamp: timestamp,
                notes: attachmentDataUrl ? `Product generated with ${attachmentType === 'pdf' ? 'PDF Blueprint' : 'Image Document'} attached` : 'Product generated and label printed',
                qc: QC_STATUS.PASSED
              }]
            };
            
            setProducts([newProduct, ...products]);
            return newProduct;
          };

          // Adds finished products that already exist (not produced through the workflow) straight into Sales Department stock
          const addExistingProducts = (details, quantity) => {
            const qty = Math.max(1, Math.min(200, parseInt(quantity, 10) || 1));
            const timestamp = new Date().toISOString();
            const base = products.length;
            const hasCost = details.cost !== '' && details.cost !== undefined && !isNaN(Number(details.cost));
            const created = Array.from({ length: qty }, (_, i) => ({
              id: `PRD-2026-${(base + i + 1).toString().padStart(4, '0')}`,
              name: details.name.trim(),
              batchNo: (details.batchNo || '').trim() || 'Existing Stock',
              priority: 'Standard',
              material: (details.material || '').trim(),
              allocations: {},
              attachment: null,
              attachmentType: null,
              currentStage: 'Sales Department',
              qcStatus: QC_STATUS.PASSED,
              createdAt: timestamp,
              pendingReceipt: false,
              existingStock: true,
              ...(hasCost ? { cost: Number(details.cost) } : {}),
              ...((details.location || '').trim() ? { warehouseLocation: details.location.trim() } : {}),
              history: [{
                id: Date.now() + i,
                stage: 'Sales Department',
                action: 'Existing Finished Product Added',
                terminal: currentTerminal.name,
                timestamp: timestamp,
                notes: 'Existing finished product added directly to Sales Department stock',
                qc: QC_STATUS.PASSED
              }]
            }));
            setProducts([...created.slice().reverse(), ...products]);
            return created;
          };

          const updateProductCost = (productId, cost) => {
            setProducts(products.map(p => p.id === productId ? { ...p, cost: cost } : p));
          };

          const updateProductWarehouseLocation = (productId, warehouseLocation) => {
            setProducts(products.map(p => p.id === productId ? { ...p, warehouseLocation: warehouseLocation } : p));
          };

          const processScanAction = (productId, newStage, actionData) => {
            const timestamp = new Date().toISOString();
            
            setProducts(products.map(p => {
              if (p.id !== productId) return p;
              
              let finalActionString = actionData.actionName || 'Processed / Moved';
              if (actionData.qc === QC_STATUS.REWORK) finalActionString = 'Flagged for Rework';
              else if (actionData.qc === QC_STATUS.SCRAP) finalActionString = 'Product Scrapped';
              else if (actionData.saleInfo) finalActionString = 'Sale Confirmed - Receipt Issued';

              // A product is "pending receipt" when it has just been transferred to a new
              // department (not received, not sold, not scrapped) and no one has acted on it there yet.
              const isTransferOut = actionData.actionType === 'TRANSFER' && !actionData.saleInfo && actionData.qc !== QC_STATUS.SCRAP;

              const newHistoryEntry = {
                id: Date.now(),
                stage: newStage,
                action: finalActionString,
                terminal: currentTerminal.name,
                timestamp: timestamp,
                notes: actionData.notes || '',
                qc: actionData.qc,
                saleInfo: actionData.saleInfo || null
              };

              return {
                ...p,
                currentStage: newStage,
                qcStatus: actionData.qc,
                saleInfo: actionData.saleInfo || p.saleInfo || null,
                pendingReceipt: isTransferOut,
                history: [newHistoryEntry, ...p.history]
              };
            }));
          };

          const processSplitTransfer = (parentId, destDepartments, actionData) => {
            const timestamp = new Date().toISOString();

            setProducts(prevProducts => {
              const parent = prevProducts.find(p => p.id === parentId);
              if (!parent) return prevProducts;

              const childIds = destDepartments.map((_, idx) => `${parent.id}-${String.fromCharCode(65 + idx)}`);

              const splitHistoryEntry = {
                id: Date.now(),
                stage: 'Split Across Departments',
                action: `Split into ${destDepartments.length} sub-batches: ${childIds.join(', ')}`,
                terminal: currentTerminal.name,
                timestamp: timestamp,
                notes: actionData.notes || '',
                qc: actionData.qc,
                saleInfo: null
              };

              const updatedParent = {
                ...parent,
                currentStage: 'Split Across Departments',
                qcStatus: actionData.qc,
                pendingReceipt: false,
                splitChildren: childIds,
                splitNote: actionData.splitNote || '',
                history: [splitHistoryEntry, ...parent.history]
              };

              const children = destDepartments.map((dept, idx) => {
                const childId = childIds[idx];
                const childHistoryEntry = {
                  id: Date.now() + idx + 1,
                  stage: dept,
                  action: `Split from ${parent.id} — Routed to Department`,
                  terminal: currentTerminal.name,
                  timestamp: timestamp,
                  notes: actionData.notes || '',
                  qc: actionData.qc,
                  saleInfo: null
                };
                return {
                  ...parent,
                  id: childId,
                  parentId: parent.id,
                  splitLabel: String.fromCharCode(65 + idx),
                  splitChildren: null,
                  splitNote: actionData.splitNote || '',
                  currentStage: dept,
                  qcStatus: actionData.qc,
                  pendingReceipt: true,
                  history: [childHistoryEntry, ...parent.history]
                };
              });

              return [
                ...children,
                updatedParent,
                ...prevProducts.filter(p => p.id !== parentId)
              ];
            });
          };

          const acknowledgeReceipt = (productId) => {
            const timestamp = new Date().toISOString();
            setProducts(products.map(p => {
              if (p.id !== productId) return p;
              const newHistoryEntry = {
                id: Date.now(),
                stage: p.currentStage,
                action: 'Receipt Acknowledged',
                terminal: currentTerminal.name,
                timestamp: timestamp,
                notes: '',
                qc: p.qcStatus,
                saleInfo: null
              };
              return {
                ...p,
                pendingReceipt: false,
                history: [newHistoryEntry, ...p.history]
              };
            }));
          };

          if (!currentTerminal) return <LoginScreen terminals={terminals} onLogin={handleLogin} />;

          return (
            <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-slate-300 flex flex-col">
              <style>{`
                @media print {
                  body * { visibility: hidden; }
                  .print-only, .print-only * { visibility: visible; }
                  .print-only { display: block !important; position: absolute; top: 0; left: 0; width: 100%; }
                  body { background: white; margin: 0; padding: 0; }
                  @page { margin: 1cm; size: A4 portrait; }
                }
                .print-only { display: none; }
                .custom-scrollbar::-webkit-scrollbar { width: 6px; }
                .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
                .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
                .no-scrollbar::-webkit-scrollbar { display: none; }
                .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
              `}</style>

              {/* App Header */}
              <header className="bg-white text-slate-900 shadow-sm border-b border-slate-200 no-print sticky top-0 z-50 flex-shrink-0">
                <div className="max-w-[1400px] mx-auto px-4 h-16 flex justify-between items-center">
                  <div className="flex items-center gap-3">
                    <div className="px-1 flex items-center flex-shrink-0">
                      <img src={LOGO_URL} alt="AD2006GH Ltd" className="h-10 w-auto block" />
                    </div>
                    <div className="hidden sm:block">
                      <p className="text-xs text-slate-500 font-mono tracking-wider uppercase">Enterprise Tracking Core</p>
                    </div>
                  </div>

                  {currentTerminal.role === ROLES.MANAGER && (
                    <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
                      <button
                        onClick={() => setAdminView('ANALYTICS')}

        function AdminPasswordCard({ requestConfirm }) {
          const [current, setCurrent] = useState('');
          const [next, setNext] = useState('');
          const [confirmPw, setConfirmPw] = useState('');
          const [msg, setMsg] = useState(null);
          const usingDefault = !getStoredAdminHash();

          const submit = (e) => {
            e.preventDefault();
            if (!checkAdminPassword(current)) { setMsg({ type: 'error', text: 'Current password is incorrect.' }); return; }
            if (next.length < 6) { setMsg({ type: 'error', text: 'New password must be at least 6 characters.' }); return; }
            if (next !== confirmPw) { setMsg({ type: 'error', text: 'New password and confirmation do not match.' }); return; }
            if (next === current) { setMsg({ type: 'error', text: 'New password must be different from the current one.' }); return; }
            requestConfirm('Change the administrator password?', () => {
              if (saveAdminPassword(next)) {
                setCurrent(''); setNext(''); setConfirmPw('');
                setMsg({ type: 'success', text: 'Password changed. Use the new password next time you sign in as Admin.' });
              } else {
                setMsg({ type: 'error', text: 'Could not save the password on this device (browser storage unavailable).' });
              }
            });
          };

          const field = "w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-700 outline-none";
          return (
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">

                <Lock className="w-5 h-5 text-black" /> Admin Password

              {usingDefault && (
                <div className="mb-4 p-3 bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-xl flex items-start gap-2">
                  <AlertTriangle className="w-4 h-4 flex-shrink-0 mt-0.5" />
                  <span>You are still using the default password. Please change it now.</span>
                </div>
              )}
              <form onSubmit={submit} className="space-y-3">
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Current Password</label>
                  <input type="password" value={current} onChange={e => { setCurrent(e.target.value); setMsg(null); }} className={field} autoComplete="current-password" required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase mb-1">New Password</label>
                  <input type="password" value={next} onChange={e => { setNext(e.target.value); setMsg(null); }} className={field} autoComplete="new-password" required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Confirm New Password</label>
                  <input type="password" value={confirmPw} onChange={e => { setConfirmPw(e.target.value); setMsg(null); }} className={field} autoComplete="new-password" required />
                </div>
                {msg && (
                  <p className={`text-xs flex items-center gap-1 ${msg.type === 'error' ? 'text-red-600' : 'text-emerald-600'}`}>
                    {msg.type === 'error' ? <AlertCircle className="w-3.5 h-3.5" /> : <CheckSquare className="w-3.5 h-3.5" />}{msg.text}
                  </p>
                )}
                <button type="submit" className="px-4 py-2.5 bg-black hover:bg-slate-800 text-white rounded-xl text-sm font-bold transition-colors">Change Password</button>
              </form>
            </div>
          );
        }

              setPinInput('');
              setPinError('');

            })).filter(group => group.messages.length > 0);
          }, [pendingReceiptMessages, departments]);

          const getTerminalForDept = (dept) => terminals.find(t => t.dept === dept);

          const handleSavePin = (dept) => {
            const draft = pinDrafts[dept] !== undefined ? pinDrafts[dept] : (getTerminalForDept(dept)?.pin || '');
            if (draft && !/^\d{4,8}$/.test(draft)) {
              setPinMessage(prev => ({ ...prev, [dept]: { type: 'error', text: 'PIN must be 4-8 digits.' } }));
              return;
            }
            requestConfirm(draft ? `Set the PIN for "${dept.replace(' Department', '')}"?` : `Remove the PIN for "${dept.replace(' Department', '')}"?`, () => {
              setDepartmentPin(dept, draft);
              setPinMessage(prev => ({ ...prev, [dept]: { type: 'success', text: draft ? 'PIN saved.' : 'PIN removed.' } }));
            });
          };

          const handleClearPin = (dept) => {
            requestConfirm(`Remove the PIN for "${dept.replace(' Department', '')}"?`, () => {
              setPinDrafts(prev => ({ ...prev, [dept]: '' }));
              setDepartmentPin(dept, '');
              setPinMessage(prev => ({ ...prev, [dept]: { type: 'success', text: 'PIN removed.' } }));
            });
          };

          const handleAddDepartment = (e) => {
            e.preventDefault();
            if (!newDeptName.trim()) {
              setDeptSuccess('');
              setDeptError('Please enter a department name.');
              return;
            }
            requestConfirm(`Add a new department called "${newDeptName.trim()}"? A staff terminal will be created for it.`, () => {
              const result = addDepartment(newDeptName);
              if (!result.ok) {
                setDeptSuccess('');
                setDeptError(result.error);
                return;
              }
              setDeptError('');
              setDeptSuccess(`"${newDeptName.trim()}" was added. A staff terminal was created for it.`);
              setNewDeptName('');
            });
          };

          const handleRemoveDepartment = (dept) => {
            requestConfirm(`Delete "${dept.replace(' Department', '')}"? This also removes its staff terminal. This cannot be undone.`, () => {
              const result = removeDepartment(dept);
              if (!result.ok) {
                setDeptSuccess('');
                setDeptError(result.error);
                return;
              }
              setDeptError('');
              setDeptSuccess(`"${dept.replace(' Department', '')}" was deleted.`);
              // If it was checked in the form in progress, uncheck it too
              setAllocations(prev => {
                if (!prev[dept]) return prev;
                const next = { ...prev };
                delete next[dept];
                return next;
              });
            });
          };

          const filteredProducts = products.filter(p => {
            const matchesSearch = p.id.toLowerCase().includes(searchTerm.toLowerCase()) || p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.batchNo.toLowerCase().includes(searchTerm.toLowerCase());
            const matchesDate = dateFilter ? p.createdAt.startsWith(dateFilter) : true;
            return matchesSearch && matchesDate;
          });

          const handleToggleDept = (dept) => {
            setAllocations(prev => {
              const newAlloc = { ...prev };
              if (newAlloc[dept]) delete newAlloc[dept];
              else newAlloc[dept] = 1; 
              return newAlloc;
            });
          };

          const handleDaysChange = (dept, days) => {
            if (days < 1) return;
            setAllocations(prev => ({ ...prev, [dept]: days }));
          };

          const handleFileChange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type === 'application/pdf') {
              setIsRenderingPdf(true);
              setError('');
              const reader = new FileReader();
              reader.onload = async (evt) => {
                try {
                  const typedarray = new Uint8Array(evt.target.result);
                  if (!window.pdfjsLib) throw new Error("PDF Library not loaded");
                  
                  const pdf = await window.pdfjsLib.getDocument({ data: typedarray }).promise;
                  const page = await pdf.getPage(1); // Render page 1 for document cover
                  const viewport = page.getViewport({ scale: 2.0 }); // Hi-Res
                  
                  const canvas = document.createElement('canvas');
                  const context = canvas.getContext('2d');
                  canvas.height = viewport.height;
                  canvas.width = viewport.width;

                  await page.render({ canvasContext: context, viewport: viewport }).promise;
                  
                  const renderedImg = canvas.toDataURL('image/png');
                  setAttachmentDataUrl(renderedImg);
                  setAttachmentType('pdf');
                } catch (err) {
                  console.error("PDF Render Error:", err);
                  setError("Failed to render PDF document. Please try a valid image or PDF.");
                } finally {
                  setIsRenderingPdf(false);
                }
              };
              reader.readAsArrayBuffer(file);
            } else {
              // Standard Image File / Camera Capture
              const reader = new FileReader();
              reader.onloadend = () => {
                setAttachmentDataUrl(reader.result);
                setAttachmentType('image');
              };
              reader.readAsDataURL(file);
            }
          };

          const handleSubmit = (e) => {
            e.preventDefault();
            if (Object.keys(allocations).length === 0) {
              setError('You must select at least one department to work on this project.');
              return;
            }
            setError('');
            requestConfirm(`Register new product "${formData.name}" (Batch ${formData.batchNo}) across ${Object.keys(allocations).length} department(s)?`, () => {
              const newProduct = registerProduct(formData, allocations, attachmentDataUrl, attachmentType);
              setLatestProduct(newProduct);
              setPrintMode(attachmentDataUrl ? 'DOCUMENT' : 'TAG');

              // Reset form
              setFormData({ name: '', batchNo: '', priority: 'Standard', material: '' });
              setAllocations({});
              setAttachmentDataUrl(null);
              setAttachmentType(null);
              if (fileInputRef.current) fileInputRef.current.value = '';
            });
          };

          const triggerPrint = (product, mode) => {
            setLatestProduct(product);
            setPrintMode(mode);
            // Wait a tick so the print-only DOM node updates with the right product/mode before printing
            setTimeout(() => window.print(), 150);
          };

          const toggleTagSelection = (id) => {
            setSelectedTagIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
          };

          const toggleSelectAllTags = () => {
            const visibleIds = filteredProducts.map(p => p.id);
            const allSelected = visibleIds.length > 0 && visibleIds.every(id => selectedTagIds.includes(id));
            setSelectedTagIds(allSelected ? [] : visibleIds);
          };

          const triggerBulkPrint = () => {
            const chosen = products.filter(p => selectedTagIds.includes(p.id));
            if (chosen.length === 0) return;
            setBulkPrintProducts(chosen);
            setPrintMode('BULK_TAG');
            setTimeout(() => window.print(), 150);
          };

          return (
            <div className="space-y-6 relative pb-24">
              
              {historyProduct && (
                <ProductHistoryModal 
                  product={historyProduct} 
                  onClose={() => setHistoryProduct(null)} 
                />
              )}

              {/* Horizontal Admin Tabs */}
              <div className="fixed bottom-0 inset-x-0 z-40 flex overflow-x-auto no-scrollbar bg-white border-t border-slate-200 shadow-lg no-print lg:w-fit lg:max-w-[calc(100%-2rem)] lg:mx-auto lg:bottom-4 lg:rounded-2xl lg:border lg:shadow-xl">
                <button
                  onClick={() => setActiveTab('REGISTER')}
                  className={`flex-1 lg:flex-none min-w-[64px] px-1 sm:px-4 lg:px-6 py-2.5 lg:py-3 font-bold text-[11px] sm:text-sm border-t-2 transition-colors flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 whitespace-nowrap ${activeTab === 'REGISTER' ? 'border-black text-black' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
                >
                  <Plus className="w-4 h-4" /> <span className="hidden sm:inline">Register New Product</span><span className="sm:hidden">Register</span>
                </button>
                <button
                  onClick={() => setActiveTab('PINS')}
                  className={`flex-1 lg:flex-none min-w-[64px] px-1 sm:px-4 lg:px-6 py-2.5 lg:py-3 font-bold text-[11px] sm:text-sm border-t-2 transition-colors flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 whitespace-nowrap ${activeTab === 'PINS' ? 'border-black text-black' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
                >
                  <Lock className="w-4 h-4" /> <span className="hidden sm:inline">Passwords &amp; PINs</span><span className="sm:hidden">PINs</span>
                </button>
                <button
                  onClick={() => setActiveTab('REGISTRY')}
                  className={`flex-1 lg:flex-none min-w-[64px] px-1 sm:px-4 lg:px-6 py-2.5 lg:py-3 font-bold text-[11px] sm:text-sm border-t-2 transition-colors flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 whitespace-nowrap ${activeTab === 'REGISTRY' ? 'border-black text-black' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
                >
                  <LayoutDashboard className="w-4 h-4" /> <span className="inline-flex flex-row items-center whitespace-nowrap"><span className="hidden sm:inline">Master Production Registry</span><span className="sm:hidden">Registry</span>
                  <span className={`ml-1 px-1.5 sm:px-2 py-0.5 rounded-full text-[10px] font-bold ${activeTab === 'REGISTRY' ? 'bg-slate-200 text-black' : 'bg-slate-200 text-slate-600'}`}>{products.length}</span></span>
                </button>
                <button
                  onClick={() => setActiveTab('TRANSIT')}
                  className={`flex-1 lg:flex-none min-w-[64px] px-1 sm:px-4 lg:px-6 py-2.5 lg:py-3 font-bold text-[11px] sm:text-sm border-t-2 transition-colors flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 whitespace-nowrap ${activeTab === 'TRANSIT' ? 'border-black text-black' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
                >
                  <Inbox className="w-4 h-4" /> <span className="hidden sm:inline">In Transit</span><span className="sm:hidden">Transit</span>
                  {pendingReceiptMessages.length > 0 && (
                    <span className={`ml-1 px-2 py-0.5 rounded-full text-[10px] font-bold ${activeTab === 'TRANSIT' ? 'bg-slate-200 text-black' : 'bg-red-500 text-white'}`}>{pendingReceiptMessages.length}</span>
                  )}
                </button>
                <button
                  onClick={() => setActiveTab('TERMINALS')}
                  className={`flex-1 lg:flex-none min-w-[64px] px-1 sm:px-4 lg:px-6 py-2.5 lg:py-3 font-bold text-[11px] sm:text-sm border-t-2 transition-colors flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 whitespace-nowrap ${activeTab === 'TERMINALS' ? 'border-black text-black' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
                >
                  <MonitorSmartphone className="w-4 h-4" /> <span className="hidden sm:inline">Terminal Selection</span><span className="sm:hidden">Terminals</span>
                </button>
              </div>

              {activeTab === 'TERMINALS' && (
              <div className="max-w-3xl bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 className="text-2xl font-bold text-slate-800 mb-2">Terminal Selection</h2>
                <p className="text-slate-500 mb-5">Select a department terminal to begin processing. You can return to Admin at any time.</p>
                <div className="space-y-3">
                  {terminals.filter(t => t.role !== ROLES.ADMIN).map(terminal => (
                    <button
                      key={terminal.id}
                      type="button"
                      onClick={() => requestConfirm(`Open the "${terminal.name}" terminal?`, () => openTerminalAsAdmin(terminal))}
                      className="w-full text-left p-4 rounded-2xl bg-white border border-slate-200 hover:border-slate-700 hover:shadow-md transition-all group flex items-center justify-between gap-3"
                    >
                      <div className="flex items-center gap-4 min-w-0">
                        <div className="bg-slate-100 group-hover:bg-slate-200 p-3 rounded-xl text-slate-500 group-hover:text-black transition-colors flex-shrink-0">
                          {terminal.role === ROLES.MANAGER ? <LayoutDashboard className="w-6 h-6" /> : <MonitorSmartphone className="w-6 h-6" />}
                        </div>
                        <div className="min-w-0">
                          <p className="font-bold text-slate-800 text-lg group-hover:text-black transition-colors flex items-center gap-1.5 break-words">
                            {terminal.name}
                            {terminal.pin && <Lock className="w-3.5 h-3.5 text-slate-400 flex-shrink-0" />}
                          </p>
                          <div className="flex items-center gap-2 text-sm mt-1">
                            <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium">{terminal.role}</span>
                          </div>
                        </div>
                      </div>
                      <ChevronRight className="w-5 h-5 text-slate-300 group-hover:text-slate-600 flex-shrink-0 transform group-hover:translate-x-1 transition-all" />
                    </button>
                  ))}
                </div>
              </div>
              )}

              {activeTab === 'REGISTER' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-2 space-y-6">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <h2 className="text-lg font-bold flex items-center gap-2 mb-6 text-slate-800">
                    <Plus className="w-5 h-5 text-black" /> System: Register New Product
                  </h2>
                  
                  {error && <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm font-medium rounded-lg flex items-center gap-2"><AlertCircle className="w-4 h-4"/>{error}</div>}
                  
                  <form onSubmit={handleSubmit} className="space-y-4">
                    <div>
                      <label className="block text-sm font-semibold text-slate-700 mb-1">Product Name / Model *</label>
                      <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-700 outline-none" placeholder="e.g. Executive Desk" />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-slate-700 mb-1">Batch Number *</label>
                      <input type="text" required value={formData.batchNo} onChange={e => setFormData({...formData, batchNo: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-700 outline-none font-mono uppercase" placeholder="e.g. B-1055" />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-slate-700 mb-1">Material Composition</label>
                      <input type="text" value={formData.material} onChange={e => setFormData({...formData, material: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-700 outline-none" placeholder="e.g. Solid Oak, Varnish" />
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm font-semibold text-slate-700 mb-1">Priority</label>
                        <select value={formData.priority} onChange={e => setFormData({...formData, priority: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-700 outline-none bg-white">
                          {PRIORITIES.map(p => <option key={p} value={p}>{p}</option>)}
                        </select>
                      </div>
                    </div>

                    {/* Camera / Image / PDF Upload Section */}
                    <div className="pt-4 border-t border-slate-100">
                      <label className="block text-sm font-bold text-slate-700 mb-1">PDF or Picture Blueprint</label>
                      <p className="text-xs text-slate-500 mb-3">Upload a PDF document or camera photo. This will print on the front page below the Project ID and QR Code.</p>
                      
                      {isRenderingPdf ? (
                        <div className="flex items-center justify-center p-6 bg-slate-50 rounded-xl border border-slate-200 text-black gap-2 font-medium text-sm">
                           <div className="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
                           Processing PDF Document...
                        </div>
                      ) : attachmentDataUrl ? (
                         <div className="relative rounded-xl border-2 border-slate-700 p-2 overflow-hidden bg-slate-50 group">
                            <div className="flex items-center justify-between mb-2 px-1">
                               <span className="text-xs font-bold text-black uppercase flex items-center gap-1">
                                 {attachmentType === 'pdf' ? <FileText className="w-3.5 h-3.5 text-red-500"/> : <Image className="w-3.5 h-3.5 text-slate-600"/>} 
                                 {attachmentType === 'pdf' ? 'PDF Page Preview' : 'Image Attachment'}
                               </span>
                               <button type="button" onClick={() => { setAttachmentDataUrl(null); setAttachmentType(null); if(fileInputRef.current) fileInputRef.current.value=''; }} className="text-red-500 hover:text-red-700 text-xs font-bold flex items-center gap-1">
                                 <XCircle className="w-4 h-4" /> Remove
                               </button>
                            </div>
                            <img src={attachmentDataUrl} alt="Preview" className="w-full h-36 object-contain rounded-lg bg-white border border-slate-200" />
                         </div>
                      ) : (
                        <div className="flex items-center justify-center w-full">
                          <label className="flex flex-col items-center justify-center w-full h-28 border-2 border-slate-300 border-dashed rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors">
                              <div className="flex flex-col items-center justify-center pt-5 pb-6">
                                  <div className="flex gap-2 mb-1">
                                    <Camera className="w-5 h-5 text-slate-400" />
                                    <FileUp className="w-5 h-5 text-slate-400" />
                                  </div>
                                  <p className="text-xs font-semibold text-slate-600 text-center">Upload PDF or Take Picture</p>
                                  <p className="text-[10px] text-slate-400">PDF, PNG, JPG supported</p>
                              </div>
                              <input 
                                ref={fileInputRef}
                                type="file" 
                                accept="image/*,application/pdf" 
                                capture="environment" 
                                className="hidden" 
                                onChange={handleFileChange}
                              />
                          </label>
                        </div>
                      )}
                    </div>

                    <div className="pt-4 border-t border-slate-100">
                      <label className="block text-sm font-bold text-slate-700 mb-2">Project Routing & Time Allocation</label>
                      <p className="text-xs text-slate-500 mb-3">Select the departments required for this project and assign the allowed duration in days.</p>

                      <div className="flex gap-2 items-start bg-amber-50 border border-amber-200 rounded-xl p-3 mb-4">
                        <AlertCircle className="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5" />
                        <p className="text-xs text-amber-800 leading-relaxed">
                          <span className="font-bold">How to select stages:</span> Tick every department this product must pass through, in the order the workflow will follow. For each ticked department, enter the number of days it is allowed to stay there — this sets its deadline. Leave a department unchecked if the product will skip it.
                        </p>
                      </div>
                      
                      <div className="space-y-2">
                        {departments.map(dept => (
                          <div key={dept} className={`flex flex-wrap sm:flex-nowrap items-center gap-3 p-3 rounded-xl border transition-colors ${allocations[dept] ? 'bg-slate-100 border-slate-300' : 'bg-slate-50 border-slate-200'}`}>
                            <input 
                              type="checkbox" 
                              checked={!!allocations[dept]} 
                              onChange={() => handleToggleDept(dept)}
                              className="w-5 h-5 text-black rounded border-slate-300 focus:ring-slate-700" 
                            />
                            <span className={`flex-1 text-sm font-medium ${allocations[dept] ? 'text-black' : 'text-slate-600'}`}>
                              {dept.replace(' Department', '')}
                            </span>
                            
                            {allocations[dept] && (
                              <div className="flex items-center gap-2 bg-white px-2 py-1 rounded-lg border border-slate-200">
                                <input 
                                  type="number" 
                                  min="1" 
                                  value={allocations[dept]}
                                  onChange={(e) => handleDaysChange(dept, parseInt(e.target.value))}
                                  className="w-14 p-1 text-center font-bold text-black outline-none" 
                                />
                                <span className="text-xs text-slate-500 uppercase font-bold tracking-wider">Days</span>
                              </div>
                            )}

                            <button
                              type="button"
                              onClick={() => handleRemoveDepartment(dept)}
                              className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors flex-shrink-0 ml-auto sm:ml-0"
                              title={`Delete ${dept.replace(' Department', '')}`}
                            >
                              <Trash className="w-4 h-4" />
                            </button>
                          </div>
                        ))}
                      </div>

                      <div className="mt-4 pt-4 border-t border-dashed border-slate-200">
                        <p className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Don't see the department you need?</p>
                        <div className="flex flex-col sm:flex-row gap-2 w-full">
                          <input
                            type="text"
                            value={newDeptName}
                            onChange={(e) => { setNewDeptName(e.target.value); setDeptError(''); setDeptSuccess(''); }}
                            onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); handleAddDepartment(e); } }}
                            placeholder="e.g. Upholstery Department"
                            className="w-full sm:flex-1 min-w-0 p-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-700 focus:border-transparent outline-none"
                          />
                          <button
                            type="button"
                            onClick={handleAddDepartment}
                            className="flex items-center justify-center gap-1.5 px-3 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-sm font-bold transition-colors flex-shrink-0 whitespace-nowrap w-full sm:w-auto"
                          >
                            <Plus className="w-4 h-4" /> Add Department
                          </button>
                        </div>
                        {deptError && <p className="text-xs text-red-600 mt-2 flex items-center gap-1"><AlertCircle className="w-3.5 h-3.5" />{deptError}</p>}
                        {deptSuccess && <p className="text-xs text-emerald-600 mt-2 flex items-center gap-1"><CheckSquare className="w-3.5 h-3.5" />{deptSuccess}</p>}
                        <p className="text-[10px] text-slate-400 mt-2">New departments appear here and in the routing checklist immediately, and get their own staff login terminal.</p>
                      </div>
                    </div>

                    <button type="submit" className="w-full bg-slate-900 hover:bg-black text-white font-semibold py-4 px-4 rounded-xl transition-colors mt-6 shadow-lg">
                      Commit to Database & Generate ID
                    </button>
                  </form>
                </div>
              </div>

              <div className="lg:col-span-1 space-y-6">
                {/* Dynamic QR Display Panel (Interactive Preview) */}
                {latestProduct ? (
                  <div className="bg-slate-100 p-6 rounded-2xl border border-slate-300 transition-all">
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="font-bold text-black flex items-center gap-2"><Printer className="w-4 h-4"/> Active Document</h3>
                      <button onClick={() => setLatestProduct(null)} className="text-slate-600 hover:text-black">
                        <XCircle className="w-5 h-5" />
                      </button>
                    </div>
                    
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-center relative overflow-hidden group">
                      <div className="absolute top-0 left-0 w-full h-1 bg-black"></div>
                      <h4 className="font-mono text-2xl font-bold text-slate-800 tracking-wider mb-1">{latestProduct.id}</h4>
                      <p className="text-sm font-medium text-slate-600 mb-4">{latestProduct.name}</p>
                      
                      <div className="bg-slate-50 inline-block p-4 rounded-xl border border-slate-100 mb-4">
                        <img src={`https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${latestProduct.id}`} alt="QR" className="w-32 h-32 mx-auto mix-blend-multiply" />
                      </div>
                      
                      <div className="grid grid-cols-2 gap-2 text-left text-xs mb-4 p-3 bg-slate-50 rounded-lg">
                        <div><span className="text-slate-400">Batch:</span> <span className="font-mono font-medium">{latestProduct.batchNo}</span></div>
                        <div><span className="text-slate-400">Priority:</span> <span className="font-medium">{latestProduct.priority}</span></div>
                        <div className="col-span-2"><span className="text-slate-400">Attachment:</span> <span className="font-medium">{latestProduct.attachment ? (latestProduct.attachmentType === 'pdf' ? 'PDF Document' : 'Image Photo') : 'None'}</span></div>
                      </div>
                      
                      <div className="flex flex-col gap-2">
