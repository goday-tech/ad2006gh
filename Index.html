                              <span className="px-2 py-1 bg-green-100 text-green-700 rounded-full text-[11px] font-bold">Yes</span>
                            </td>
                            <td className="p-4 text-right" onClick={e => e.stopPropagation()}>
                              {editingCostId === p.id ? (
                                <div className="flex items-center justify-end gap-1">
                                  <input
                                    type="number"
                                    min="0"
                                    step="0.01"
                                    autoFocus
                                    value={costDraft}
                                    onChange={e => setCostDraft(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') saveCost(p.id); if (e.key === 'Escape') setEditingCostId(null); }}
                                    className="w-24 p-1 text-right border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-slate-700"
                                  />
                                  <button onClick={() => saveCost(p.id)} className="text-green-600 hover:text-green-800" title="Save"><CheckCircle2 className="w-4 h-4" /></button>
                                  <button onClick={() => setEditingCostId(null)} className="text-slate-400 hover:text-slate-600" title="Cancel"><XCircle className="w-4 h-4" /></button>
                                </div>
                              ) : isAdmin ? (
                                <button onClick={() => startEditCost(p)} className="font-mono text-slate-700 hover:text-black underline decoration-dotted">
                                  {p.cost != null ? Number(p.cost).toFixed(2) : 'Set cost'}
                                </button>
                              ) : (
                                <span className="font-mono text-slate-700">{p.cost != null ? Number(p.cost).toFixed(2) : '—'}</span>
                              )}
                            </td>
                            <td className="p-4 text-right text-xs text-slate-500">
                              {p.history.length > 0 ? new Date(p.history[0].timestamp).toLocaleString() : 'N/A'}
                            </td>
                          </tr>
                        )) : (
                          <tr>
                            <td colSpan="7" className="p-12 text-center text-slate-500">
                              No finished products match your search.
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* SALES DASHBOARD TAB */}
              {activeTab === 'SALES' && (
                <div className="space-y-6 animate-in fade-in">
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                      <div className="p-4 bg-green-100 text-green-600 rounded-xl"><DollarSign className="w-8 h-8" /></div>
                      <div><p className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">Total Revenue</p><p className="text-2xl font-bold text-slate-900">GHS {totalRevenue.toFixed(2)}</p></div>
                    </div>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                      <div className="p-4 bg-slate-200 text-black rounded-xl"><Package className="w-8 h-8" /></div>
                      <div><p className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">Units Sold</p><p className="text-2xl font-bold text-slate-900">{totalUnitsSold}</p></div>
                    </div>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-4">
                      <div className="p-4 bg-slate-200 text-black rounded-xl"><Activity className="w-8 h-8" /></div>
                      <div><p className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">Avg. Sale Price</p><p className="text-2xl font-bold text-slate-900">GHS {avgSalePrice.toFixed(2)}</p></div>
                    </div>
                    <div className="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800 text-white flex flex-col justify-center">
                      <p className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-1">{isAdmin ? 'Est. Profit (Revenue - Cost)' : 'Total Revenue'}</p>
                      {isAdmin ? (
                        <p className={`text-2xl font-light font-mono ${totalProfit >= 0 ? 'text-green-400' : 'text-red-400'}`}>GHS {totalProfit.toFixed(2)}</p>
                      ) : (
                        <p className="text-2xl font-light font-mono text-slate-400">GHS {totalRevenue.toFixed(2)}</p>
                      )}
                    </div>
                  </div>

                  {isAdmin && (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                      <h2 className="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
                        <BarChart3 className="w-5 h-5 text-black" /> Units Sold vs. Not Sold
                      </h2>
                      <p className="text-xs text-slate-500 mb-4">Based on finished products in the Finished Product tab that have not yet been recorded as sold.</p>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-100">
                          <p className="text-slate-500 uppercase text-[11px] font-bold mb-1">Amount of Products Sold</p>
                          <p className="text-xl font-bold text-slate-800">{totalUnitsSold}</p>
                        </div>
                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-100">
                          <p className="text-slate-500 uppercase text-[11px] font-bold mb-1">Amount Not Sold</p>
                          <p className="text-xl font-bold text-slate-800">{unitsNotSold}</p>
                        </div>
                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-100">
                          <p className="text-slate-500 uppercase text-[11px] font-bold mb-1">Est. Profit</p>
                          <p className={`text-xl font-bold ${totalProfit >= 0 ? 'text-green-600' : 'text-red-600'}`}>GHS {totalProfit.toFixed(2)}</p>
                        </div>
                      </div>
                    </div>
                  )}

                  {paymentMethodBreakdown.length > 0 && (
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                      <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <Inbox className="w-5 h-5 text-black" /> Revenue by Payment Method
                      </h2>
                      <div className="flex flex-wrap gap-3">
                        {paymentMethodBreakdown.map(pm => (
                          <div key={pm.method} className="px-4 py-3 rounded-xl bg-slate-50 border border-slate-100">
                            <p className="text-[11px] font-bold text-slate-500 uppercase">{pm.method}</p>
                            <p className="text-lg font-bold text-slate-800">GHS {pm.total.toFixed(2)}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* MONTH & YEAR SALES REPORT */}
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-50">
                      <div>
                        <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                          <BarChart3 className="w-5 h-5 text-black" /> Monthly &amp; Yearly Sales Report
                        </h2>
                        <p className="text-xs text-slate-500 mt-1">Amount of sales by month for the selected year.</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <select
                          value={reportYear}
                          onChange={e => setReportYear(Number(e.target.value))}
                          className="px-3 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-700 bg-white font-bold"
                        >
                          {availableSalesYears.map(y => <option key={y} value={y}>{y}</option>)}
                        </select>
                        <select
                          value={reportMonth}
                          onChange={e => setReportMonth(e.target.value)}
                          className="px-3 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-700 bg-white"
                        >
                          <option value="ALL">All Months</option>
                          {MONTH_NAMES.map((name, idx) => <option key={idx} value={idx}>{name}</option>)}
                        </select>
                        <button
                          onClick={() => handleSalesReportAction('PRINT')}
                          disabled={isGeneratingReport}
                          className="flex items-center gap-1.5 px-3 py-2 bg-white text-black hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl text-xs font-bold transition-colors border border-slate-300 shadow-sm"
                          title="Print detailed report for the selected period"
                        >
                          <Printer className="w-3.5 h-3.5" /> {isGeneratingReport ? 'Preparing…' : 'Print Report'}
                        </button>
                        <button
                          onClick={() => handleSalesReportAction('DOWNLOAD')}
                          disabled={isGeneratingReport}
                          className="flex items-center gap-1.5 px-3 py-2 bg-white text-emerald-700 hover:bg-emerald-100 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl text-xs font-bold transition-colors border border-emerald-200 shadow-sm"
                          title="Download detailed report (PDF) for the selected period"
                        >
                          <FileUp className="w-3.5 h-3.5" /> {isGeneratingReport ? 'Preparing…' : 'Download Report'}
                        </button>
                      </div>
                    </div>

                    <div className="p-5 border-b border-slate-100 bg-slate-50/50">
                      <div className="p-4 bg-white rounded-xl border border-slate-200 inline-block">
                        <p className="text-slate-500 uppercase text-[11px] font-bold mb-1">Amount of Sales in {reportYear}</p>
                        <p className="text-2xl font-bold text-slate-800">GHS {yearTotals.revenue.toFixed(2)}</p>
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-sm whitespace-nowrap">
                        <thead className="bg-white sticky top-0 shadow-sm z-10">
                          <tr className="text-slate-400 uppercase tracking-wider text-[11px] font-bold border-b border-slate-100">
                            <th className="p-4">Month</th>
                            <th className="p-4 text-right">Amount of Sales (GHS)</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {monthlySalesReport.map(r => (
                            <tr
                              key={r.month}
                              onClick={() => setReportMonth(String(r.month))}
                              className={`cursor-pointer hover:bg-slate-100 transition-colors ${reportMonth === String(r.month) ? 'bg-slate-100' : ''} ${r.units === 0 ? 'text-slate-400' : ''}`}
                            >
                              <td className="p-4 font-medium">{r.name}</td>
                              <td className="p-4 text-right font-bold">{r.revenue.toFixed(2)}</td>
                            </tr>
                          ))}
                        </tbody>
                        <tfoot>
                          <tr className="bg-slate-50 border-t-2 border-slate-200 font-bold text-slate-800">
                            <td className="p-4">Total ({reportYear})</td>
                            <td className="p-4 text-right">{yearTotals.revenue.toFixed(2)}</td>
                          </tr>
                        </tfoot>
                      </table>
                    </div>

                    {reportMonth !== 'ALL' && (
                      <div className="border-t border-slate-100">
                        <div className="p-4 bg-slate-50 flex items-center justify-between">
                          <p className="text-sm font-bold text-slate-700">
                            Transactions for {MONTH_NAMES[Number(reportMonth)]} {reportYear} ({reportFilteredSales.length})
                          </p>
                          <button onClick={() => setReportMonth('ALL')} className="text-xs font-bold text-black hover:text-black">
                            Clear Month Filter
                          </button>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead>
                              <tr className="text-slate-400 uppercase tracking-wider text-[11px] font-bold border-b border-slate-100">
                                <th className="p-4">Receipt No</th>
                                <th className="p-4">Product</th>
                                <th className="p-4">Customer</th>
                                <th className="p-4 text-right">Amount (GHS)</th>
                                <th className="p-4 text-right">Date</th>
                                <th className="p-4 text-right">Receipt</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {reportFilteredSales.length > 0 ? reportFilteredSales.map(p => (
                                <tr key={p.id} className="hover:bg-slate-100 transition-colors">
                                  <td className="p-4 font-mono font-bold text-black">{p.saleInfo.receiptNo}</td>
                                  <td className="p-4">{p.name} <span className="text-slate-400 font-mono text-xs">({p.id})</span></td>
                                  <td className="p-4">{p.saleInfo.customerName}</td>
                                  <td className="p-4 text-right font-bold">{Number(p.saleInfo.salePrice).toFixed(2)}</td>
                                  <td className="p-4 text-right text-xs text-slate-500">{new Date(p.saleInfo.soldAt).toLocaleString()}</td>
                                  <td className="p-4 text-right">
                                    <div className="flex items-center justify-end gap-2">
                                      <button onClick={() => printSalesReceipt(p, p.saleInfo)} className="text-black hover:text-black" title="Print Receipt"><Printer className="w-4 h-4" /></button>
                                      <button onClick={() => downloadSalesReceipt(p, p.saleInfo)} className="text-green-600 hover:text-green-800" title="Download Receipt"><FileText className="w-4 h-4" /></button>
                                    </div>
                                  </td>
                                </tr>
                              )) : (
                                <tr>
                                  <td colSpan="6" className="p-8 text-center text-slate-500">No sales recorded for this month.</td>
                                </tr>
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col min-h-[300px]">
                    <div className="p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-50">
                      <div>
                        <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                          <FileText className="w-5 h-5 text-black" /> Sales Transactions
                        </h2>
                        <p className="text-xs text-slate-500 mt-1">Every confirmed sale, most recent first.</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <div className="relative">
                          <Search className="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" />
                          <input type="text" placeholder="Search receipt, product, customer..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-700 w-full sm:w-64 transition-all bg-white" />
                        </div>
                        <input type="date" value={dateFilter} onChange={e => setDateFilter(e.target.value)} className="px-3 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-700 bg-white" />
                      </div>
                    </div>
                    <div className="overflow-x-auto flex-1">
                      <table className="w-full text-left text-sm whitespace-nowrap">
                        <thead className="bg-white sticky top-0 shadow-sm z-10">
                          <tr className="text-slate-400 uppercase tracking-wider text-[11px] font-bold border-b border-slate-100">
                            <th className="p-4">Receipt No</th>
                            <th className="p-4">Product</th>
                            <th className="p-4">Customer</th>
                            <th className="p-4">Payment</th>
                            <th className="p-4 text-right">Amount (GHS)</th>
                            <th className="p-4 text-right">Date</th>
                            <th className="p-4 text-right">Receipt</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filteredSoldProducts.length > 0 ? filteredSoldProducts.map(p => (
                            <tr key={p.id} className="hover:bg-slate-100 transition-colors">
                              <td className="p-4 font-mono font-bold text-black">{p.saleInfo.receiptNo}</td>
                              <td className="p-4">
                                <div className="font-medium text-slate-700">{p.name}</div>
                                <div className="text-slate-400 text-xs font-mono">{p.id}</div>
                              </td>
                              <td className="p-4">
                                <div className="font-medium text-slate-700">{p.saleInfo.customerName}</div>
                                {p.saleInfo.customerPhone && <div className="text-slate-400 text-xs">{p.saleInfo.customerPhone}</div>}
                              </td>
                              <td className="p-4 text-slate-600">{p.saleInfo.paymentMethod}</td>
                              <td className="p-4 text-right font-bold text-slate-800">{Number(p.saleInfo.salePrice).toFixed(2)}</td>
                              <td className="p-4 text-right text-xs text-slate-500">{new Date(p.saleInfo.soldAt).toLocaleString()}</td>
                              <td className="p-4 text-right">
                                <div className="flex items-center justify-end gap-2">
                                  <button onClick={() => printSalesReceipt(p, p.saleInfo)} className="text-black hover:text-black" title="Print Receipt"><Printer className="w-4 h-4" /></button>
                                  <button onClick={() => downloadSalesReceipt(p, p.saleInfo)} className="text-green-600 hover:text-green-800" title="Download Receipt"><FileText className="w-4 h-4" /></button>
                                </div>
                              </td>
                            </tr>
                          )) : (
                            <tr>
                              <td colSpan="7" className="p-12 text-center text-slate-500">
                                No sales match your search.
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* AUDIT LOG TAB */}
              {activeTab === 'AUDIT' && (
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col min-h-[600px] animate-in fade-in">
                  <div className="p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-50">
                    <div>
                      <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800">
                        <History className="w-5 h-5 text-black" /> Factory Floor Event Stream
                      </h2>
                      <p className="text-xs text-slate-500 mt-1">Raw chronological feed of all factory operations.</p>
                    </div>
                    <div className="flex flex-col sm:flex-row gap-2">
                       <div className="relative">
                         <Search className="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" />
                         <input type="text" placeholder="Search events..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-700 w-full sm:w-48 transition-all bg-white" />
                       </div>
                       <input type="date" value={dateFilter} onChange={e => setDateFilter(e.target.value)} className="px-3 py-2 text-sm border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-700 text-slate-600 w-full sm:w-auto transition-all bg-white" />
                    </div>
                  </div>
                  <div className="overflow-y-auto flex-1 p-4 custom-scrollbar">
                    {filteredLogs.length > 0 ? filteredLogs.map((log, index) => (
                      <div key={log.id} className="flex gap-4 p-4 hover:bg-slate-50 rounded-xl transition-colors group cursor-pointer max-w-4xl mx-auto" onClick={() => setHistoryProduct(products.find(p=>p.id === log.productId))}>
                        <div className="w-16 text-right flex-shrink-0 pt-1">
                          <div className="text-xs font-bold text-slate-800">{new Date(log.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                          <div className="text-[10px] text-slate-400 uppercase">{new Date(log.timestamp).toLocaleDateString([], {month:'short', day:'numeric'})}</div>
                        </div>
                        
                        <div className="relative flex flex-col items-center w-4">
                          <div className={`w-3 h-3 rounded-full z-10 ${log.qc === QC_STATUS.REWORK ? 'bg-orange-500 ring-4 ring-orange-100' : 'bg-slate-700 ring-4 ring-slate-100'}`}></div>
                          {index !== filteredLogs.length - 1 && <div className="absolute top-3 w-px h-full bg-slate-200"></div>}
                        </div>
                        
                        <div className="flex-1 pb-4">
                          <div className="flex justify-between items-start mb-1">
                            <div>
                              <span className="font-mono font-bold text-black text-sm hover:underline">{log.productId}</span>
                              <span className="text-slate-400 text-sm mx-2">•</span>
                              <span className="font-semibold text-slate-800">{log.action}</span>
                            </div>
                            <QCBadge status={log.qc} />
                          </div>
                          <div className="text-sm text-slate-600 mb-2">
                            Stage: <span className="font-medium text-slate-900">{log.stage}</span>
                          </div>
                          {log.notes && (
                            <div className="bg-slate-100 text-slate-700 text-sm p-3 rounded-lg border border-slate-200 flex items-start gap-2 mb-2">
                              <FileText className="w-4 h-4 text-slate-400 mt-0.5 flex-shrink-0" />
                              <p className="italic">{log.notes}</p>
                            </div>
                          )}
                          <div className="text-xs text-slate-500 flex items-center gap-1">
                            <MonitorSmartphone className="w-3 h-3" /> Logged by: <span className="font-medium">{log.terminal}</span>
                          </div>
                        </div>
                      </div>
                    )) : (
                      <div className="p-12 text-center text-slate-500">
                        <History className="w-12 h-12 mx-auto mb-4 opacity-20" />
                        No events match your search criteria.
                      </div>
                    )}
                  </div>
                </div>
              )}

            </div>
          );
        }

        // ==========================================
        // UTILITY COMPONENTS
        // ==========================================
        function QCBadge({ status }) {
          if (status === QC_STATUS.PASSED) return <span className="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-green-100 text-green-700 border border-green-200"><CheckCircle2 className="w-3 h-3 mr-1" /> Pass</span>;
          if (status === QC_STATUS.REWORK) return <span className="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-orange-100 text-orange-700 border border-orange-200"><AlertTriangle className="w-3 h-3 mr-1" /> Rework</span>;
          if (status === QC_STATUS.SCRAP) return <span className="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-red-100 text-red-700 border border-red-200"><XCircle className="w-3 h-3 mr-1" /> Scrap</span>;
          return <span className="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-slate-100 text-slate-600">Pending</span>;
        }

        // Initialize App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
