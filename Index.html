        // ==========================================
        // ADMIN PASSWORD (stored on this device only, as a hash)
        // ==========================================
        const ADMIN_PW_KEY = 'ad2006_admin_pw_hash';
        const DEFAULT_ADMIN_PASSWORD = 'admin123';
        function hashPassword(pw) {
          const str = 'ad2006gh|' + String(pw);
          let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
          for (let i = 0; i < str.length; i++) {
            const ch = str.charCodeAt(i);
            h1 = Math.imul(h1 ^ ch, 2654435761);
            h2 = Math.imul(h2 ^ ch, 1597334677);
          }
          h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
          h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
          return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
        }
        function getStoredAdminHash() {
          try { return localStorage.getItem(ADMIN_PW_KEY); } catch (e) { return null; }
        }
        function checkAdminPassword(pw) {
          const stored = getStoredAdminHash();
          return hashPassword(pw) === (stored || hashPassword(DEFAULT_ADMIN_PASSWORD));
        }
        function saveAdminPassword(pw) {
          try { localStorage.setItem(ADMIN_PW_KEY, hashPassword(pw)); return true; } catch (e) { return false; }
        }

        // ==========================================
        // DOWNLOADABLE DOCUMENT (Tag + Attachment merged into one PDF)
        // ==========================================
        async function fetchImageAsDataUrl(url) {
          const response = await fetch(url);
          const blob = await response.blob();
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
        }

        async function downloadProductDocument(product) {
          try {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: 'a4' });
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 15;

            // --- ID Tag header block (front of the page) ---
            doc.setFont(undefined, 'bold');
            doc.setFontSize(9);
            doc.setTextColor(90);
            doc.text('AD2006GH LTD - PROJECT DOCUMENT', margin, 15);

            doc.setFontSize(22);
            doc.setTextColor(0);
            doc.text(String(product.id), margin, 26);

            doc.setFontSize(13);
            doc.setFont(undefined, 'normal');
            doc.text(String(product.name || ''), margin, 34);

            doc.setFontSize(10);
            doc.text(`Batch: ${product.batchNo || '-'}`, margin, 42);
            doc.text(`Priority: ${product.priority || '-'}`, margin, 48);
            doc.text(`Doc Type: ${product.attachmentType === 'pdf' ? 'PDF Document' : 'Camera Picture'}`, margin, 54);
            doc.text(`Date: ${new Date().toLocaleDateString()}`, margin, 60);

            // QR / ID tag square, top-right, so the tag sits in front on the page
            try {
              const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(product.id)}`;
              const qrDataUrl = await fetchImageAsDataUrl(qrUrl);
              const qrSize = 32;
              const qrX = pageWidth - margin - qrSize;
              doc.setDrawColor(0);
              doc.rect(qrX - 1, 9, qrSize + 2, qrSize + 2);
              doc.addImage(qrDataUrl, 'PNG', qrX, 10, qrSize, qrSize);
              doc.setFontSize(6);
              doc.text('SCAN FOR LOCATION', qrX + qrSize / 2, 10 + qrSize + 4, { align: 'center' });
            } catch (qrErr) {
              console.error('QR embed failed, continuing without it:', qrErr);
            }

            doc.setDrawColor(30);
            doc.setLineWidth(0.8);
            doc.line(margin, 66, pageWidth - margin, 66);

            // --- Attached picture / PDF page image, placed below the tag ---
            if (product.attachment) {
              const imgProps = doc.getImageProperties(product.attachment);
              const maxWidth = pageWidth - margin * 2;
              const maxHeight = pageHeight - 78;
              let w = imgProps.width;
              let h = imgProps.height;
              const ratio = Math.min(maxWidth / w, maxHeight / h);
              w *= ratio;
              h *= ratio;
              const x = (pageWidth - w) / 2;
              doc.addImage(product.attachment, imgProps.fileType || 'PNG', x, 72, w, h);
            }

            doc.save(`${product.id}_Document.pdf`);
          } catch (err) {
            console.error('Failed to generate downloadable document:', err);
            alert('Could not generate the downloadable document. Please try the Print option instead.');
          }
        }

        async function buildSalesReceiptDoc(product, saleInfo) {

          const doc = new jsPDF({ unit: 'mm', format: 'a5' });

          doc.text('Official Sales Receipt', margin, y);
          y += 8;

          doc.setDrawColor(30);
          doc.setLineWidth(0.5);
          doc.line(margin, y, pageWidth - margin, y);
          y += 8;

          doc.setTextColor(0);

          doc.text(`Date: ${new Date(saleInfo.soldAt).toLocaleString()}`, margin, y);
          y += 6;
          doc.text(`Issued By: ${saleInfo.terminal}`, margin, y);
          y += 10;

          doc.setFont(undefined, 'bold');
          doc.text('Product', margin, y);
          y += 6;
          doc.setFont(undefined, 'normal');
          doc.text(`${product.id} - ${product.name}`, margin, y);
          y += 5;
          doc.text(`Batch: ${product.batchNo || '-'}`, margin, y);
          y += 10;

          doc.setFont(undefined, 'bold');
          doc.text('Customer', margin, y);
          y += 6;
          doc.setFont(undefined, 'normal');
          doc.text(`Name: ${saleInfo.customerName}`, margin, y);
          y += 5;
          doc.text(`Phone: ${saleInfo.customerPhone || '-'}`, margin, y);
          y += 10;

          doc.setDrawColor(200);
          doc.line(margin, y, pageWidth - margin, y);
          y += 8;

          doc.setFontSize(11);
          doc.setFont(undefined, 'bold');
          doc.text(`Amount Paid: GHS ${Number(saleInfo.salePrice).toFixed(2)}`, margin, y);
          y += 6;
          doc.setFontSize(9);
          doc.setFont(undefined, 'normal');
          doc.text(`Payment Method: ${saleInfo.paymentMethod}`, margin, y);
          y += 10;

          if (saleInfo.notes) {
            doc.setFont(undefined, 'italic');
            doc.text(`Notes: ${saleInfo.notes}`, margin, y, { maxWidth: pageWidth - margin * 2 });
            y += 10;
          }

          try {
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(saleInfo.receiptNo)}`;
            const qrDataUrl = await fetchImageAsDataUrl(qrUrl);
            const qrSize = 26;
            doc.addImage(qrDataUrl, 'PNG', pageWidth - margin - qrSize, y, qrSize, qrSize);
          } catch (qrErr) {
            console.error('Receipt QR embed failed, continuing without it:', qrErr);
          }

          doc.setFontSize(8);
          doc.setTextColor(120);
          doc.text('Thank you for your purchase.', margin, y + 30);

          return doc;
        }

        async function downloadSalesReceipt(product, saleInfo) {
          try {
            const doc = await buildSalesReceiptDoc(product, saleInfo);
            doc.save(`${saleInfo.receiptNo}_Receipt.pdf`);
          } catch (err) {
            console.error('Failed to generate sales receipt:', err);
            alert('Sale was confirmed, but the receipt PDF could not be generated. You can reprint it from the product history.');
          }
        }

        async function printSalesReceipt(product, saleInfo) {
          try {
            const doc = await buildSalesReceiptDoc(product, saleInfo);
            doc.autoPrint();
            const blobUrl = doc.output('bloburl');
            const printWindow = window.open(blobUrl, '_blank');
            if (!printWindow) {
              alert('Please allow pop-ups to print the receipt. The receipt will download instead.');
              doc.save(`${saleInfo.receiptNo}_Receipt.pdf`);
            }
          } catch (err) {
            console.error('Failed to print sales receipt:', err);
            alert('Could not open the receipt for printing. You can try downloading it instead.');
          }
        }

        // ==========================================
        // DETAILED MONTHLY / YEARLY SALES REPORT (PDF)
        // ==========================================
        async function buildSalesReportDoc({ reportYear, reportMonth, monthNames, monthlySalesReport, yearTotals, transactions }) {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: 'mm', format: 'a4' });
          const pageWidth = doc.internal.pageSize.getWidth();
          const pageHeight = doc.internal.pageSize.getHeight();
          const margin = 14;
          let y = 18;

          const isYearly = reportMonth === 'ALL';
          const periodLabel = isYearly ? `Yearly Sales Report — ${reportYear}` : `Monthly Sales Report — ${monthNames[Number(reportMonth)]} ${reportYear}`;
          const periodRow = isYearly ? null : monthlySalesReport[Number(reportMonth)];
          const summaryRevenue = isYearly ? yearTotals.revenue : periodRow.revenue;
          const summaryUnits = isYearly ? yearTotals.units : periodRow.units;

          const ensureSpace = (needed, redrawHeader) => {
            if (y + needed > pageHeight - 14) {
              doc.addPage();
              y = 18;
              if (redrawHeader) redrawHeader();
            }
          };

          doc.setFont(undefined, 'bold');
          doc.setFontSize(16);
          doc.text('AD2006GH LTD', margin, y);
          y += 7;
          doc.setFontSize(11);
          doc.setFont(undefined, 'normal');
          doc.setTextColor(90);
          doc.text(periodLabel, margin, y);
          y += 5;
          doc.setFontSize(8);
          doc.text(`Generated ${new Date().toLocaleString()}`, margin, y);
          y += 8;

          doc.setDrawColor(30);
          doc.setLineWidth(0.5);
          doc.line(margin, y, pageWidth - margin, y);
          y += 8;

          doc.setTextColor(0);
          doc.setFont(undefined, 'bold');
          doc.setFontSize(10);
          doc.text('Summary', margin, y);
          y += 6;
          doc.setFont(undefined, 'normal');
          doc.setFontSize(9);
          doc.text(`Total Revenue: GHS ${summaryRevenue.toFixed(2)}`, margin, y);
          y += 5;
          doc.text(`Units Sold: ${summaryUnits}`, margin, y);
          y += 5;
          y += 4;

          if (isYearly) {
            ensureSpace(20);
            doc.setFont(undefined, 'bold');
            doc.setFontSize(10);
            doc.text('Month-by-Month Breakdown', margin, y);
            y += 6;
            doc.setFontSize(8);
            const col = { month: margin, units: margin + 55, revenue: margin + 85 };
            const drawMonthlyHeader = () => {
              doc.setFontSize(8);
              doc.setFont(undefined, 'bold');
              doc.text('Month', col.month, y);
              doc.text('Units', col.units, y);
              doc.text('Revenue (GHS)', col.revenue, y);
              y += 2;
              doc.setDrawColor(200);
              doc.line(margin, y, pageWidth - margin, y);
              y += 4;
              doc.setFont(undefined, 'normal');
            };
            drawMonthlyHeader();
            monthlySalesReport.forEach(r => {
              ensureSpace(6, drawMonthlyHeader);
              doc.text(r.name, col.month, y);
              doc.text(String(r.units), col.units, y);
              doc.text(r.revenue.toFixed(2), col.revenue, y);
              y += 5;
            });
            y += 4;
          }

          ensureSpace(20);
          doc.setFont(undefined, 'bold');
          doc.setFontSize(10);
          doc.text(`Transaction Detail (${transactions.length})`, margin, y);
          y += 6;
          doc.setFontSize(8);
          const tCol = { receipt: margin, product: margin + 28, customer: margin + 82, method: margin + 122, amount: margin + 150, date: margin + 172 };
          const drawTransactionHeader = () => {
            doc.setFontSize(8);
            doc.setFont(undefined, 'bold');
            doc.text('Receipt', tCol.receipt, y);
            doc.text('Product', tCol.product, y);
            doc.text('Customer', tCol.customer, y);
            doc.text('Method', tCol.method, y);
            doc.text('Amount', tCol.amount, y);
            doc.text('Date', tCol.date, y);
            y += 2;
            doc.setDrawColor(200);
            doc.line(margin, y, pageWidth - margin, y);
            y += 4;
            doc.setFont(undefined, 'normal');
          };
          drawTransactionHeader();

          if (transactions.length === 0) {
            doc.setTextColor(120);
            doc.text('No transactions recorded for this period.', margin, y);
            y += 5;
          } else {
            transactions.forEach(p => {
              ensureSpace(6, drawTransactionHeader);
              doc.text(String(p.saleInfo.receiptNo || '-'), tCol.receipt, y);
              doc.text(String(p.name || '-').slice(0, 26), tCol.product, y);
              doc.text(String(p.saleInfo.customerName || '-').slice(0, 20), tCol.customer, y);
              doc.text(String(p.saleInfo.paymentMethod || '-'), tCol.method, y);
              doc.text(Number(p.saleInfo.salePrice || 0).toFixed(2), tCol.amount, y);
              doc.text(new Date(p.saleInfo.soldAt).toLocaleDateString(), tCol.date, y);
              y += 5;
            });
          }

          return doc;
        }

        const TAG_ROWS_PER_COLUMN = 5; // bulk tag print fills 5 tags down a column before starting the next column

        function chunkArray(arr, size) {
          const safeSize = Math.max(1, Number(size) || 1);
          const chunks = [];
          for (let i = 0; i < arr.length; i += safeSize) {
            chunks.push(arr.slice(i, i + safeSize));
          }
          return chunks;
        }

        function salesReportFileName(reportYear, reportMonth, monthNames) {
          const period = reportMonth === 'ALL' ? `Yearly_${reportYear}` : `${monthNames[Number(reportMonth)]}_${reportYear}`;
          return `AD2006GH_Sales_Report_${period}.pdf`;
        }

        function getStageEntryTimestamp(product, stage) {
          const entry = product.history.find(h => h.stage === stage);
          return entry ? entry.timestamp : product.createdAt;
        }

        // Scans all products and returns one "delay message" for every product
        // that has overstayed its allocated day budget in its current department.
        function getDelayedProducts(products, departments) {
          const now = Date.now();
          const messages = [];
          const deptList = departments || CORE_DEPARTMENTS;

          products.forEach(p => {
            if (p.qcStatus === QC_STATUS.SCRAP) return;
            const dept = p.currentStage;
            if (!deptList.includes(dept)) return;

            const allocatedDays = p.allocations && p.allocations[dept];
            if (!allocatedDays) return;

            const enteredAt = new Date(getStageEntryTimestamp(p, dept)).getTime();
            const daysInDept = (now - enteredAt) / 86400000;
            const daysOverdue = daysInDept - allocatedDays;

            if (daysOverdue > 0) {
              messages.push({
                id: `${p.id}-${dept}`,
                product: p,
                department: dept,
                allocatedDays,
                daysInDept,
                daysOverdue
              });
            }
          });

          return messages.sort((a, b) => b.daysOverdue - a.daysOverdue);
        }

        function getPendingReceiptProducts(products, departments) {
          const deptList = departments || CORE_DEPARTMENTS;
          return products
            .filter(p => p.pendingReceipt && p.qcStatus !== QC_STATUS.SCRAP && deptList.includes(p.currentStage))
            .map(p => ({
              id: `${p.id}-pending`,
              product: p,
              department: p.currentStage,
              transferredAt: p.history[0] ? p.history[0].timestamp : p.createdAt
            }))
            .sort((a, b) => new Date(a.transferredAt) - new Date(b.transferredAt));
        }

dow-sm lg:col-span-2 overflow-hidden\">\n   <div class=\"p-6 border-b border-slate-100 bg-slate-50 flex justify-between items-center\">\n    <h3 class=\"font-bold\">Recent Movements Log<\/h3>\n    <button onclick=\"switchTab('movements')\" class=\"text-xs font-semibold text-brand-600\">View All &rarr;<\/button>\n   <\/div>\n   <div class=\"overflow-x-auto custom-scrollbar\">\n    <table class=\"w-full text-sm text-left text-slate-600\">\n     <thead class=\"text-[11px] uppercase tracking-wider font-bold bg-white text-slate-400 border-b border-slate-100\"><tr><th class=\"px-4 py-3\">Date<\/th><th class=\"px-4 py-3\">Material<\/th><th class=\"px-4 py-3\">From / To<\/th><th class=\"px-4 py-3\">Type<\/th><th class=\"px-4 py-3 text-right\">Qty<\/th><\/tr><\/thead>\n     <tbody id=\"dashboard-recent-movements\"><\/tbody>\n    <\/table>\n   <\/div>\n  <\/div>\n  <div class=\"bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col\">\n   <div class=\"p-5 border-b bg-rose-50/50 flex justify-between items-center\">\n    <div class=\"flex items-center space-x-2\"><i class=\"fa-solid fa-bell text-rose-500 animate-pulse\"><\/i><h3 class=\"font-bold\">Urgent Restock Needed<\/h3><\/div>\n    <span id=\"badge-urgent-count\" class=\"bg-rose-100 text-rose-700 text-xs font-bold px-2 py-0.5 rounded-full\">0<\/span>\n   <\/div>\n   <div class=\"p-4 overflow-y-auto max-h-[300px] custom-scrollbar space-y-3\" id=\"dashboard-reorder-list\"><\/div>\n  <\/div>\n <\/div>\n <div class=\"bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden\">\n  <div class=\"p-6 border-b border-slate-100 bg-slate-50\"><h3 class=\"font-bold\">Department Issue Summary<\/h3><p class=\"text-xs text-slate-500\">Total goods taken by each department (value uses unit cost)<\/p><\/div>\n  <div class=\"overflow-x-auto custom-scrollbar\">\n   <table class=\"w-full text-sm text-left text-slate-600\">\n    <thead class=\"text-[11px] uppercase tracking-wider font-bold bg-white text-slate-400 border-b border-slate-100\"><tr><th class=\"px-5 py-3\">Department<\/th><th class=\"px-5 py-3 text-right\">Issues<\/th><th class=\"px-5 py-3 text-right\">Total Value<\/th><th class=\"px-5 py-3\">Last Issue<\/th><\/tr><\/thead>\n    <tbody id=\"dept-summary-body\"><\/tbody>\n   <\/table>\n  <\/div>\n <\/div>\n <div class=\"bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden\">\n  <div class=\"p-6 border-b border-slate-100 bg-slate-50 flex justify-between items-center\">\n   <div><h3 class=\"font-bold\">Maintenance Due<\/h3><p class=\"text-xs text-slate-500\">Machines overdue, due within 7 days, or not running<\/p><\/div>\n   <button onclick=\"switchTab('machines')\" class=\"text-xs font-semibold text-brand-600\">View machines &rarr;<\/button>\n  <\/div>\n  <div class=\"overflow-x-auto custom-scrollbar\">\n   <table class=\"w-full text-sm text-left text-slate-600\">\n    <thead class=\"text-[11px] uppercase tracking-wider font-bold bg-white text-slate-400 border-b border-slate-100\"><tr><th class=\"px-5 py-3\">Asset Tag<\/th><th class=\"px-5 py-3\">Machine<\/th><th class=\"px-5 py-3\">Status<\/th><th class=\"px-5 py-3\">Next Maintenance<\/th><\/tr><\/thead>\n    <tbody id=\"dashboard-maint-body\"><\/tbody>\n   <\/table>\n  <\/div>\n <\/div>\n<\/section>\n\n<!-- MATERIALS -->\n<section id=\"page-materials\" class=\"page-content space-y-6 hidden\">\n <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm\">\n  <div class=\"flex flex-wrap items-center gap-3 flex-1\">\n   <div class=\"relative min-w-[220px] flex-1\">\n    <i class=\"fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm\"><\/i>\n    <input type=\"text\" id=\"materials-search\" placeholder=\"Search material name or SKU...\" oninput=\"renderMaterialsTable()\" class=\"w-full pl-9 pr-4 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500\">\n   <\/div>\n   <select id=\"materials-filter-status\" onchange=\"renderMaterialsTable()\" class=\"border border-slate-200 rounded-xl text-sm py-2 px-3 bg-white\">\n    <option value=\"ALL\">All Stock Statuses<\/option><option value=\"IN_STOCK\">In Stock<\/option><option value=\"LOW_STOCK\">Low Stock<\/option><option value=\"OUT_OF_STOCK\">Out of Stock<\/option>\n   <\/select>\n   <select id=\"materials-filter-category\" onchange=\"renderMaterialsTable()\" class=\"border border-slate-200 rounded-xl text-sm py-2 px-3 bg-white\"><option value=\"ALL\">All Categories<\/option><\/select>\n  <\/div>\n  <div class=\"flex items-center space-x-2\">\n   <button onclick=\"openMaterialModal()\" class=\"bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-xl flex items-center space-x-2\"><i class=\"fa-solid fa-plus\"><\/i><span>Add Material<\/span><\/button>\n  <\/div>\n <\/div>\n <div class=\"bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden\">\n  <div class=\"overflow-x-auto custom-scrollbar\">\n   <table class=\"w-full text-sm text-left text-slate-600\">\n    <thead class=\"text-[11px] uppercase tracking-wider font-bold bg-white text-slate-400 border-b border-slate-100\"><tr>\n     <th data-sort=\"sku\" onclick=\"sortMaterials('sku')\" class=\"px-5 py-3 cursor-pointer select-none hover:text-slate-900 \">SKU / Code<span class=\"sort-ind ml-1 text-brand-600\"><\/span><\/th><th data-sort=\"name\" onclick=\"sortMaterials('name')\" class=\"px-5 py-3 cursor-pointer select-none hover:text-slate-900 \">Material Name<span class=\"sort-ind ml-1 text-brand-600\"><\/span><\/th><th data-sort=\"category\" onclick=\"sortMaterials('category')\" class=\"px-5 py-3 cursor-pointer select-none hover:text-slate-900 \">Category<span class=\"sort-ind ml-1 text-brand-600\"><\/span><\/th><th data-sort=\"location\" onclick=\"sortMaterials('location')\" class=\"px-5 py-3 cursor-pointer select-none hover:text-slate-900 \">Location<span class=\"sort-ind ml-1 text-brand-600\"><\/span><\/th><th data-sort=\"unit\" onclick=\"sortMaterials('unit')\" class=\"px-5 py-3 cursor-pointer select-none hover:text-slate-900 \">Unit<span class=\"sort-ind ml-1 text-brand-600\"><\/span><\/th>\n     <th data-sort=\"stock\" onclick=\"sortMaterials('stock')\" class=\"px-5 py-3 cursor-pointer select-none hover:text-slate-900 text-right\">Current Stock<span class=\"sort-ind ml-1 text-brand-600\"><\/span><\/th><th data-sort=\"minThreshold\" onclick=\"sortMaterials('minThreshold')\" class=\"px-5 py-3 cursor-pointer select-none hover:text-slate-900 text-right\">Min Level<span class=\"sort-ind ml-1 text-brand-600\"><\/span><\/th><th data-sort=\"cost\" onclick=\"sortMaterials('cost')\" class=\"px-5 py-3 cursor-pointer select-none hover:text-slate-900 text-right\">Unit Cost<span class=\"sort-ind ml-1 text-brand-600\"><\/span><\/th><th data-sort=\"value\" onclick=\"sortMaterials('value')\" class=\"px-5 py-3 cursor-pointer select-none hover:text-slate-900 text-right\">Value<span class=\"sort-ind ml-1 text-brand-600\"><\/span><\/th>\n     <th data-sort=\"status\" onclick=\"sortMaterials('status')\" class=\"px-5 py-3 cursor-pointer select-none hover:text-slate-900 text-center\">Status<span class=\"sort-ind ml-1 text-brand-600\"><\/span><\/th><th class=\"px-5 py-3 text-center\">Actions<\/th><\/tr><\/thead>\n    <tbody id=\"materials-table-body\" class=\"divide-y divide-slate-100\"><\/tbody>\n   <\/table>\n  <\/div>\n <\/div>\n<\/section>\n\n<!-- MOVEMENTS -->\n<section id=\"page-movements\" class=\"page-content space-y-6 hidden\">\n <div class=\"bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3\">\n  <div class=\"flex flex-wrap items-center gap-3\">\n   <select id=\"movements-filter-type\" onchange=\"renderMovementsTable()\" class=\"border border-slate-200 rounded-xl text-sm py-2 px-3 bg-white\">\n    <option value=\"ALL\">All Movement Types<\/option><option value=\"IN\">Stock IN (+)<\/option><option value=\"OUT\">Stock OUT (-)<\/option><option value=\"ADJUST\">Adjustment (Set)<\/option>\n   <\/select>\n   <select id=\"movements-filter-material\" onchange=\"renderMovementsTable()\" class=\"border border-slate-200 rounded-xl text-sm py-2 px-3 bg-white\"><option value=\"ALL\">All Materials<\/option><\/select>\n   <select id=\"movements-filter-department\" onchange=\"renderMovementsTable()\" class=\"border border-slate-200 rounded-xl text-sm py-2 px-3 bg-white\"><option value=\"ALL\">All Departments<\/option><\/select>\n   <select id=\"movements-filter-supplier\" onchange=\"renderMovementsTable()\" class=\"border border-slate-200 rounded-xl text-sm py-2 px-3 bg-white\"><option value=\"ALL\">All Suppliers<\/option><\/select>\n  <\/div>\n  <div class=\"flex flex-wrap items-center justify-between gap-3\">\n   <div class=\"flex flex-wrap items-center gap-2 text-xs text-slate-500 max-w-full\">\n    <span>From<\/span><input type=\"date\" id=\"movements-from\" onchange=\"renderMovementsTable()\" class=\"border border-slate-200 rounded-xl text-sm py-1.5 px-2 min-w-0\">\n    <span>To<\/span><input type=\"date\" id=\"movements-to\" onchange=\"renderMovementsTable()\" class=\"border border-slate-200 rounded-xl text-sm py-1.5 px-2 min-w-0\">\n    <button onclick=\"clearMovementFilters()\" class=\"text-brand-600 font-semibold ml-1 whitespace-nowrap\">Clear<\/button>\n   <\/div>\n   <div class=\"flex items-center space-x-2\">\n    <button onclick=\"openMovementModal('IN')\" class=\"bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-3 py-2 rounded-xl\"><i class=\"fa-solid fa-plus mr-1\"><\/i>New Stock IN<\/button>\n    <button onclick=\"openMovementModal('OUT')\" class=\"bg-slate-700 hover:bg-slate-800 text-white text-sm font-medium px-3 py-2 rounded-xl\"><i class=\"fa-solid fa-minus mr-1\"><\/i>New Stock OUT<\/button>\n   <\/div>\n  <\/div>\n <\/div>\n <div class=\"bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden\">\n  <div class=\"overflow-x-auto custom-scrollbar\">\n   <table class=\"w-full text-sm text-left text-slate-600\">\n    <thead class=\"text-[11px] uppercase tracking-wider font-bold bg-white text-slate-400 border-b border-slate-100\"><tr>\n     <th class=\"px-5 py-3\">Date & Time<\/th><th class=\"px-5 py-3\">Material<\/th><th class=\"px-5 py-3\">Type<\/th><th class=\"px-5 py-3 text-right\">Quantity<\/th>\n     <th class=\"px-5 py-3\">Supplier / Department<\/th><th class=\"px-5 py-3\">Person<\/th><th class=\"px-5 py-3\">Reference<\/th><th class=\"px-5 py-3 text-right\">Value<\/th><th class=\"px-5 py-3\">Notes / Purpose<\/th><th class=\"px-5 py-3 text-center no-print\">Void<\/th><\/tr><\/thead>\n    <tbody id=\"movements-table-body\" class=\"divide-y divide-slate-100\"><\/tbody>\n   <\/table>\n  <\/div>\n <\/div>\n<\/section>\n\n<!-- SUPPLIERS -->\n<section id=\"page-suppliers\" class=\"page-content space-y-6 hidden\">\n <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm\">\n  <div class=\"relative min-w-[220px] flex-1\">\n   <i class=\"fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm\"><\/i>\n   <input type=\"text\" id=\"suppliers-search\" placeholder=\"Search supplier name, contact or phone...\" oninput=\"renderSuppliersTable()\" class=\"w-full pl-9 pr-4 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500\">\n  <\/div>\n  <div class=\"flex items-center space-x-2\"><button onclick=\"openSupplierModal()\" class=\"bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-xl\"><i class=\"fa-solid fa-plus mr-2\"><\/i>Add Supplier<\/button><\/div>\n <\/div>\n <div class=\"bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden\">\n  <div class=\"overflow-x-auto custom-scrollbar\">\n   <table class=\"w-full text-sm text-left text-slate-600\">\n    <thead class=\"text-[11px] uppercase tracking-wider font-bold bg-white text-slate-400 border-b border-slate-100\"><tr>\n     <th class=\"px-5 py-3\">Supplier<\/th><th class=\"px-5 py-3\">Contact Person<\/th><th class=\"px-5 py-3\">Phone / Email<\/th><th class=\"px-5 py-3 text-right\">Deliveries<\/th>\n     <th class=\"px-5 py-3 text-right\">Total Value Supplied<\/th><th class=\"px-5 py-3\">Last Delivery<\/th><th class=\"px-5 py-3 text-center\">Actions<\/th><\/tr><\/thead>\n    <tbody id=\"suppliers-table-body\" class=\"divide-y divide-slate-100\"><\/tbody>\n   <\/table>\n  <\/div>\n <\/div>\n<\/section>\n\n<!-- ALERTS -->\n<section id=\"page-levels\" class=\"page-content space-y-6 hidden\">\n <div class=\"bg-slate-50 border border-slate-200 rounded-2xl p-4 flex items-start space-x-3\">\n  <i class=\"fa-solid fa-shield-halved text-slate-500 text-xl mt-0.5\"><\/i>\n  <div class=\"text-xs sm:text-sm text-slate-700\"><p class=\"font-bold\">Automated Reorder Thresholds<\/p><p class=\"mt-0.5\">Materials falling below their minimum level are highlighted automatically and marked for procurement.<\/p><\/div>\n <\/div>\n <div class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4\" id=\"levels-cards-grid\"><\/div>\n<\/section>\n\n<!-- MACHINES -->\n<section id=\"page-machines\" class=\"page-content space-y-6 hidden\">\n <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm\">\n  <div class=\"flex flex-wrap items-center gap-3 flex-1\">\n   <div class=\"relative min-w-[220px] flex-1\">\n    <i class=\"fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm\"><\/i>\n    <input type=\"text\" id=\"machines-search\" placeholder=\"Search machine name or asset tag...\" oninput=\"renderMachinesTable()\" class=\"w-full pl-9 pr-4 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500\">\n   <\/div>\n   <select id=\"machines-filter-status\" onchange=\"renderMachinesTable()\" class=\"border border-slate-200 rounded-xl text-sm py-2 px-3 bg-white\">\n    <option value=\"ALL\">All Statuses<\/option><option value=\"Active\">Active<\/option><option value=\"Under Maintenance\">Under Maintenance<\/option><option value=\"Broken\">Broken / Down<\/option>\n   <\/select>\n  <\/div>\n  <div class=\"flex items-center space-x-2\">\n   <button onclick=\"openMaintenanceModal()\" class=\"bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-3 py-2 rounded-xl\"><i class=\"fa-solid fa-wrench mr-2\"><\/i>Log Maintenance<\/button>\n   <button onclick=\"openMachineModal()\" class=\"bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-3 py-2 rounded-xl\"><i class=\"fa-solid fa-plus mr-2\"><\/i>Add Machine<\/button>\n  <\/div>\n <\/div>\n <div class=\"bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden\">\n  <div class=\"overflow-x-auto custom-scrollbar\">\n   <table class=\"w-full text-sm text-left text-slate-600\">\n    <thead class=\"text-[11px] uppercase tracking-wider font-bold bg-white text-slate-400 border-b border-slate-100\"><tr>\n     <th class=\"px-5 py-3\">Asset Tag<\/th><th class=\"px-5 py-3\">Machine Name<\/th><th class=\"px-5 py-3\">Department<\/th><th class=\"px-5 py-3 text-center\">Status<\/th>\n     <th class=\"px-5 py-3\">Last Maintenance<\/th><th class=\"px-5 py-3\">Next Schedule<\/th><th class=\"px-5 py-3 text-center\">Actions<\/th><\/tr><\/thead>\n    <tbody id=\"machines-table-body\" class=\"divide-y divide-slate-100\"><\/tbody>\n   <\/table>\n  <\/div>\n <\/div>\n<\/section>\n<\/main>\n\n<footer class=\"bg-white border-t border-slate-200 py-4 text-xs text-slate-500 mt-auto no-print\">\n <div class=\"max-w-[1400px] mx-auto px-4 md:px-6 flex flex-col sm:flex-row justify-between items-center gap-2\">\n  <span>&copy; Inventory, Suppliers, Assets & Maintenance<\/span>\n  <div class=\"space-x-4\">\n   <button type=\"button\" id=\"beep-toggle\" onclick=\"toggleBeep()\" class=\"border border-slate-200 rounded text-xs py-0.5 px-2 bg-white text-slate-600 hover:bg-slate-50\" title=\"Turn the low-stock beep on or off\"><\/button>\n   <select id=\"currency-select\" onchange=\"setCurrency(this.value)\" class=\"border border-slate-200 rounded text-xs py-0.5 px-1 bg-white text-slate-600\" title=\"Currency symbol\"><option value=\"GH\u20b5\">GH\u20b5<\/option><option value=\"$\">$<\/option><option value=\"\u20ac\">\u20ac<\/option><option value=\"\u00a3\">\u00a3<\/option><option value=\"\u20a6\">\u20a6<\/option><option value=\"\">None<\/option><\/select>\n  <\/div>\n <\/div>\n<\/footer>\n\n<div id=\"modals\"><\/div>\n<div id=\"toast-container\" class=\"fixed bottom-20 right-5 z-50 flex flex-col space-y-2 pointer-events-none\"><\/div>\n\n<script>\n// ================= HELPERS =================\nconst $ = id => document.getElementById(id);\nfunction getFutureDate(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().split('T')[0];}\nfunction escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');}\nfunction formatDateTime(s){if(!s)return '';const d=new Date(s);return d.toLocaleDateString()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}\nfunction formatDateShort(s){if(!s)return '';return new Date(s).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});}\nlet currency='GH\u20b5';\nfunction money(n){return (currency?currency+' ':'')+(Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}\nfunction num(n){return Math.round((Number(n)||0)*100)/100;}\n\n// ================= STOCK ALERT BEEP =================\nlet _audioCtx=null,_stockSnap=null;\nfunction beepOn(){try{return localStorage.getItem('matflow_beep')!=='0';}catch(e){return true;}}\nfunction getAudioCtx(){\n try{\n  if(!_audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;_audioCtx=new AC();}\n  if(_audioCtx.state==='suspended')_audioCtx.resume();\n  return _audioCtx;\n }catch(e){return null;}\n}\nfunction playBeep(level){\n if(!beepOn())return;\n const ctx=getAudioCtx();if(!ctx)return;\n try{\n  const out=level==='OUT',freq=out?880:660,count=out?3:2,t0=ctx.currentTime+0.02;\n  for(let i=0;i<count;i++){\n   const o=ctx.createOscillator(),g=ctx.createGain(),t=t0+i*0.3;\n   o.type='sine';o.frequency.value=freq;\n   g.gain.setValueAtTime(0.0001,t);\n   g.gain.exponentialRampToValueAtTime(0.35,t+0.02);\n   g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);\n   o.connect(g);g.connect(ctx.destination);\n   o.start(t);o.stop(t+0.22);\n  }\n }catch(e){}\n}\nfunction updateBeepBtn(){const b=$('beep-toggle');if(b)b.innerHTML=`<i class=\"fa-solid fa-${beepOn()?'bell':'bell-slash'}\"><\/i> Alert beep: ${beepOn()?'On':'Off'}`;}\nfunction toggleBeep(){try{localStorage.setItem('matflow_beep',beepOn()?'0':'1');}catch(e){}updateBeepBtn();if(beepOn())playBeep('LOW');}\n// beeps when a material newly reaches its minimum level (2 beeps) or runs out of stock (3 beeps)\nfunction checkStockAlerts(){\n const prev=_stockSnap,cur={};\n materials.forEach(m=>{cur[m.id]=statusOf(m);});\n _stockSnap=cur;\n if(!prev)return;\n const rank={IN:0,LOW:1,OUT:2};let worst=-1;\n materials.forEach(m=>{const p=prev[m.id],c=cur[m.id];if(p!==undefined&&rank[c]>rank[p])worst=Math.max(worst,rank[c]);});\n if(worst===2)playBeep('OUT');else if(worst===1)playBeep('LOW');\n}\n['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(beepOn())getAudioCtx();},{passive:true}));\n\nfunction showToast(message,type=\"info\"){\n const c=$('toast-container'),t=document.createElement('div');\n const bg=type===\"success\"?\"bg-brand-600\":type===\"error\"?\"bg-rose-600\":\"bg-slate-800\";\n t.className=`${bg} text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 transition transform translate-y-2 opacity-0 pointer-events-auto`;\n t.innerHTML=`<i class=\"fa-solid fa-circle-info\"><\/i><span>${escapeHtml(message)}<\/span>`;\n c.appendChild(t);\n setTimeout(()=>t.classList.remove('translate-y-2','opacity-0'),10);\n setTimeout(()=>{t.classList.add('opacity-0','translate-y-2');setTimeout(()=>t.remove(),300);},3000);\n}\nconst DEPTS=['Production','Packaging','Maintenance','Quality Control','R&D','Other'];\nconst FILTER_DEPTS=[...DEPTS,'External Supplier'];\nconst TABS=[['dashboard','Dashboard','Dash','chart-pie'],['materials','Raw Materials','Materials','cubes'],['movements','Movements','Move','right-left'],\n ['suppliers','Suppliers','Suppliers','truck-field'],['machines','Machines & Maintenance','Machines','cogs']];\nconst INP='w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white';\nconst LBL='block text-xs font-bold uppercase text-slate-600 mb-1';\nconst fld=(label,inner,id='')=>`<div ${id?`id=\"${id}\"`:''}><label class=\"${LBL}\">${label}<\/label>${inner}<\/div>`;\nconst inp=(id,type='text',extra='')=>`<input type=\"${type}\" id=\"${id}\" ${extra} class=\"${INP}\">`;\nconst sel=(id,opts,extra='')=>`<select id=\"${id}\" ${extra} class=\"${INP}\">${opts}<\/select>`;\nconst opt=(vals)=>vals.map(v=>`<option value=\"${escapeHtml(v)}\">${escapeHtml(v)}<\/option>`).join('');\nconst btnRow=(closeFn,label,color='bg-brand-600 hover:bg-brand-700',id='')=>`<div class=\"pt-2 flex justify-end space-x-2\"><button type=\"button\" onclick=\"${closeFn}()\" class=\"px-4 py-2 border-2 border-black bg-white text-black rounded-xl text-sm font-bold hover:bg-slate-100\">Cancel<\/button><button type=\"submit\" ${id?`id=\"${id}\"`:''} class=\"px-4 py-2 ${color} text-white rounded-xl text-sm font-medium\">${label}<\/button><\/div>`;\nfunction modal(id,title,body,closeFn,headBg='bg-slate-800',width='max-w-md'){\n return `<div id=\"modal-${id}\" class=\"fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4\">\n <div class=\"bg-white rounded-2xl shadow-xl ${width} w-full max-h-[92vh] overflow-y-auto\">\n <div class=\"px-6 py-4 ${headBg} text-white flex justify-between items-center\"><h3 class=\"font-bold text-base\" id=\"modal-${id}-title\">${title}<\/h3>\n <button onclick=\"${closeFn}()\" class=\"opacity-70 hover:opacity-100\"><i class=\"fa-solid fa-xmark text-lg\"><\/i><\/button><\/div>${body}<\/div><\/div>`;\n}\nconst G2=(a,b)=>`<div class=\"grid grid-cols-2 gap-3\">${a}${b}<\/div>`;\n\n// ================= DEFAULT DATA (empty) =================\nconst DEFAULT_SUPPLIERS=[];\nconst DEFAULT_MATERIALS=[];\nconst DEFAULT_MOVEMENTS=[];\nconst DEFAULT_MACHINES=[];\nconst DEFAULT_MAINTENANCE=[];\n// IDs of the old built-in demo records (used once to purge them from previously saved data)\nconst OLD_DEMO_IDS={materials:['1','2','3','4'],movements:['m1','m2','m3'],machines:['mac1','mac2','mac3'],maintenance:['mr1','mr2'],suppliers:['s1','s2']};\nconst clone=o=>JSON.parse(JSON.stringify(o));\nlet materials=clone(DEFAULT_MATERIALS),movements=clone(DEFAULT_MOVEMENTS),machines=clone(DEFAULT_MACHINES),maintenanceRecords=clone(DEFAULT_MAINTENANCE),suppliers=clone(DEFAULT_SUPPLIERS);\nlet stockPieChart=null,movementBarChart=null,deptBarChart=null;\nconst supName=id=>{const s=suppliers.find(x=>x.id===id);return s?s.name:null;};\n\n// ================= STORAGE =================\nfunction saveData(){\n try{\n  localStorage.setItem('matflow_materials',JSON.stringify(materials));\n  localStorage.setItem('matflow_movements',JSON.stringify(movements));\n  localStorage.setItem('matflow_machines',JSON.stringify(machines));\n  localStorage.setItem('matflow_maintenance',JSON.stringify(maintenanceRecords));\n  localStorage.setItem('matflow_suppliers',JSON.stringify(suppliers));\n }catch(e){console.error(\"Storage save failed\",e);}\n}\nfunction loadFromLocalStorage(){\n const get=(k,cur)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):cur;}catch(e){return cur;}};\n materials=get('matflow_materials',materials);movements=get('matflow_movements',movements);\n machines=get('matflow_machines',machines);maintenanceRecords=get('matflow_maintenance',maintenanceRecords);\n suppliers=get('matflow_suppliers',suppliers);\n try{const c=localStorage.getItem('matflow_currency');if(c!==null)currency=c;}catch(e){}\n // migrate older saved data (missing new fields)\n materials.forEach(m=>{if(m.cost==null)m.cost=0;if(m.location==null)m.location='';});\n // one-time purge of the old demo records left in previously saved data\n try{\n  if(!localStorage.getItem('matflow_demo_purged')){\n   const D=OLD_DEMO_IDS,dSku=['RM-STL-001','RM-ALU-002','RM-PLS-010','RM-RUB-005'],dTag=['CNC-M-001','PKG-R-012','SRT-09'],dSup=['SteelCo Metals Ltd','PolyChem Supplies'];\n   materials=materials.filter(x=>!(D.materials.includes(x.id)&&dSku.includes(x.sku)));\n   movements=movements.filter(x=>!(D.movements.includes(x.id)&&['PO-2026-08','WO-8812','WO-8800'].includes(x.ref)));\n   machines=machines.filter(x=>!(D.machines.includes(x.id)&&dTag.includes(x.assetTag)));\n   maintenanceRecords=maintenanceRecords.filter(x=>!(D.maintenance.includes(x.id)&&!machines.some(m=>m.id===x.machineId)));\n   suppliers=suppliers.filter(x=>!(D.suppliers.includes(x.id)&&dSup.includes(x.name)));\n   localStorage.setItem('matflow_demo_purged','1');saveData();\n  }\n }catch(e){}\n}\nfunction clearAllData(){\n if(!confirm(\"Clear ALL data (materials, movements, suppliers, machines, maintenance)? This cannot be undone.\"))return;\n materials=clone(DEFAULT_MATERIALS);movements=clone(DEFAULT_MOVEMENTS);machines=clone(DEFAULT_MACHINES);maintenanceRecords=clone(DEFAULT_MAINTENANCE);suppliers=clone(DEFAULT_SUPPLIERS);\n saveData();_stockSnap=null;refreshAllViews();showToast(\"All data cleared\",\"info\");\n}\nfunction backupData(){\n const blob=new Blob([JSON.stringify({materials,movements,machines,maintenanceRecords,suppliers},null,2)],{type:'application/json'});\n const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Inventory_Backup_${new Date().toISOString().slice(0,10)}.json`;\n document.body.appendChild(a);a.click();document.body.removeChild(a);showToast(\"Backup downloaded\",\"success\");\n}\nfunction restoreData(e){\n const f=e.target.files[0];if(!f)return;\n const r=new FileReader();\n r.onload=()=>{\n  try{\n   const d=JSON.parse(r.result);\n   if(!Array.isArray(d.materials)||!Array.isArray(d.movements))throw new Error(\"bad\");\n   if(!confirm(\"Restore this backup? Current data will be replaced.\"))return;\n   materials=d.materials;movements=d.movements;machines=d.machines||[];maintenanceRecords=d.maintenanceRecords||[];suppliers=d.suppliers||[];\n   materials.forEach(m=>{if(m.cost==null)m.cost=0;if(m.location==null)m.location='';});\n   saveData();_stockSnap=null;refreshAllViews();showToast(\"Backup restored\",\"success\");\n  }catch(err){showToast(\"Invalid backup file\",\"error\");}\n };\n r.readAsText(f);e.target.value='';\n}\n\n// ================= INIT =================\nfunction buildNav(){\n $('nav-tabs').innerHTML=TABS.map(([k,l,s,i])=>`<button onclick=\"switchTab('${k}')\" id=\"tab-${k}\" class=\"nav-btn flex-1 min-w-[64px] px-1 sm:px-4 py-2.5 font-bold text-[11px] sm:text-sm border-t-2 transition-colors flex flex-col sm:flex-row items-center justify-center gap-0.5 sm:gap-2 whitespace-nowrap ${k==='dashboard'?'border-black text-black':'border-transparent text-slate-500 hover:text-slate-800'}\"><i class=\"fa-solid fa-${i}\"><\/i><span class=\"hidden sm:inline\">${l}<\/span><span class=\"sm:hidden\">${s}<\/span><\/button>`).join('');\n}\nfunction buildModals(){\n $('modals').innerHTML=\n modal('material','Add Raw Material',`<form id=\"form-material\" onsubmit=\"handleMaterialSubmit(event)\" class=\"p-6 space-y-4\">\n  <input type=\"hidden\" id=\"mat-id\">\n  ${fld('SKU / Code *',inp('mat-sku','text','required'))}\n  ${fld('Material Name *',inp('mat-name','text','required'))}\n  ${G2(fld('Category',inp('mat-category')),fld('Unit of Measure *',sel('mat-unit',opt(['Kg','Liters','Meters','Pieces','Sheets','Bags','Rolls','Cubit','Board']),'required')))}\n  ${G2(fld('Initial / Current Stock',inp('mat-stock','number','step=\"any\" min=\"0\" value=\"0\"')),fld('Min Threshold',inp('mat-min','number','step=\"any\" min=\"0\" value=\"10\"')))}\n  ${G2(fld('Unit Cost',inp('mat-cost','number','step=\"any\" min=\"0\" value=\"0\"')),fld('Storage Location',inp('mat-location','text','placeholder=\"e.g. Rack A1\"')))}\n  ${btnRow('closeMaterialModal','Save')}<\/form>`,'closeMaterialModal')+\n\n modal('movement','Record Stock Movement',`<form id=\"form-movement\" onsubmit=\"handleMovementSubmit(event)\" class=\"p-6 space-y-4\">\n  ${G2(fld('Movement Type *',sel('mov-type',`<option value=\"IN\">Stock IN (Receive)<\/option><option value=\"OUT\">Stock OUT (Issue)<\/option><option value=\"ADJUST\">Adjustment<\/option>`,'required onchange=\"updateMovementModalStyle()\"')),\n       fld('Select Raw Material *',sel('mov-material-id','','required onchange=\"updateMovementModalStyle()\"')))}\n  <div id=\"grp-in\" class=\"space-y-4 p-3 rounded-xl bg-brand-100 border border-slate-200\">\n   ${fld('Supplier *',sel('mov-supplier','','onchange=\"updateMovementModalStyle()\"'))}\n   ${G2(fld('Invoice / PO / Delivery Note #',inp('mov-invoice')),fld('Unit Cost (this delivery)',inp('mov-cost','number','step=\"any\" min=\"0\"')))}\n  <\/div>\n  <div id=\"grp-out\" class=\"space-y-4 p-3 rounded-xl bg-slate-50 border border-slate-200\">\n   ${fld('Issued To Department *',sel('mov-department',`<option value=\"\">-- Select department --<\/option>`+opt(DEPTS)))}\n   ${fld('Purpose / Work Order',inp('mov-purpose','text','placeholder=\"e.g. Line 2 production, repair job\"'))}\n  <\/div>\n  ${G2(fld('Quantity *',inp('mov-qty','number','step=\"any\" min=\"0.01\" required')),fld('Ref / PO / Batch #',inp('mov-ref')))}\n  ${fld('<span id=\"lbl-person\">Performed By<\/span>',inp('mov-person','text','placeholder=\"Name of person\"'))}\n  ${fld('Notes',inp('mov-notes'))}\n  <p id=\"mov-preview\" class=\"text-xs text-slate-500\"><\/p>\n  ${btnRow('closeMovementModal','Submit','bg-brand-600 hover:bg-brand-700','btn-submit-movement')}<\/form>`,'closeMovementModal')+\n\n modal('supplier','Add Supplier',`<form id=\"form-supplier\" onsubmit=\"handleSupplierSubmit(event)\" class=\"p-6 space-y-4\">\n  <input type=\"hidden\" id=\"sup-id\">\n  ${fld('Supplier Name *',inp('sup-name','text','required'))}\n  ${G2(fld('Contact Person',inp('sup-contact')),fld('Phone',inp('sup-phone')))}\n  ${fld('Email',inp('sup-email','email'))}\n  ${fld('Address',inp('sup-address'))}\n  ${btnRow('closeSupplierModal','Save Supplier')}<\/form>`,'closeSupplierModal')+\n\n modal('machine','Add New Machine',`<form id=\"form-machine\" onsubmit=\"handleMachineSubmit(event)\" class=\"p-6 space-y-4\">\n  <input type=\"hidden\" id=\"mac-id\">\n  ${G2(fld('Asset Tag / ID *',inp('mac-asset','text','required placeholder=\"e.g. CNC-01\"')),fld('Department',sel('mac-dept',opt(['Production','Packaging','Maintenance','Other']))))}\n  ${fld('Machine Name *',inp('mac-name','text','required placeholder=\"e.g. 5-Axis Milling Machine\"'))}\n  ${G2(fld('Status',sel('mac-status',`<option value=\"Active\">Active<\/option><option value=\"Under Maintenance\">Under Maintenance<\/option><option value=\"Broken\">Broken / Down<\/option>`)),fld('Next Maint. Date',inp('mac-next-maint','date')))}\n  ${btnRow('closeMachineModal','Save Machine')}<\/form>`,'closeMachineModal')+\n\n modal('maintenance','<i class=\"fa-solid fa-wrench mr-2\"><\/i>Log Maintenance Record',`<form id=\"form-maintenance\" onsubmit=\"handleMaintenanceSubmit(event)\" class=\"p-6 space-y-4\">\n  ${fld('Select Machine *',sel('maint-machine','','required'))}\n  ${G2(fld('Maint. Type *',sel('maint-type',`<option value=\"Preventive\">Preventive / Scheduled<\/option><option value=\"Corrective\">Corrective / Repair<\/option><option value=\"Inspection\">Inspection<\/option>`,'required')),fld('Date Performed *',inp('maint-date','date','required')))}\n  ${fld('Technician / Performed By',inp('maint-tech','text','placeholder=\"Name of technician or company\"'))}\n  ${fld('Description / Parts Replaced',`<textarea id=\"maint-desc\" rows=\"2\" class=\"${INP}\"><\/textarea>`)}\n  <div class=\"bg-slate-50 p-3 rounded-xl border border-slate-200\"><p class=\"text-[11px] font-bold text-slate-600 uppercase mb-2\">Update Machine State<\/p>\n   ${G2(fld('Set Status To',sel('maint-update-status',`<option value=\"Active\">Active<\/option><option value=\"Under Maintenance\">Under Maintenance<\/option><option value=\"Broken\">Broken<\/option>`)),fld('Set Next Maint. Date',inp('maint-next-date','date')))}<\/div>\n  ${btnRow('closeMaintenanceModal','Save Record','bg-brand-600 hover:bg-brand-700')}<\/form>`,'closeMaintenanceModal','bg-brand-600')+\n\n modal('history','Maintenance History',`<div class=\"overflow-y-auto bg-slate-50\"><table class=\"w-full text-sm text-left text-slate-600\">\n  <thead class=\"text-xs uppercase bg-slate-200 text-slate-600\"><tr><th class=\"px-4 py-3\">Date<\/th><th class=\"px-4 py-3\">Type<\/th><th class=\"px-4 py-3\">Technician<\/th><th class=\"px-4 py-3\">Details<\/th><\/tr><\/thead>\n  <tbody id=\"history-table-body\" class=\"divide-y divide-slate-200 bg-white\"><\/tbody><\/table><\/div>\n  <div class=\"p-4 border-t flex justify-end\"><button type=\"button\" onclick=\"closeMaintenanceHistoryModal()\" class=\"px-4 py-2 bg-white border-2 border-black text-black rounded-xl text-sm font-bold hover:bg-slate-100\">Close<\/button><\/div>`,'closeMaintenanceHistoryModal','bg-slate-800','max-w-2xl')+\n modal('matview','Material',`<div id=\"matview-body\"><\/div><div class=\"p-4 border-t flex justify-end\"><button type=\"button\" onclick=\"closeMaterialHistory()\" class=\"px-4 py-2 bg-white border-2 border-black text-black rounded-xl text-sm font-bold hover:bg-slate-100\">Close<\/button><\/div>`,'closeMaterialHistory','bg-slate-800','max-w-2xl');\n $('modal-history-title').id='history-title';\n}\nwindow.onload=function(){\n buildNav();buildModals();loadFromLocalStorage();refreshAllViews();\n $('currency-select').value=currency;updateBeepBtn();\n try{const t=localStorage.getItem('matflow_tab');if(t&&$('page-'+t)&&t!=='dashboard')switchTab(t);}catch(e){}\n};\nfunction refreshAllViews(){\n updateDashboard();renderMaterialsTable();renderMovementsTable();renderSuppliersTable();renderStockLevelsPage();renderMachinesTable();populateCategoryDropdowns();\n updateInboxBadge();\n checkStockAlerts();\n}\n\n// ================= INBOX (lives in the main app header) =================\nfunction toggleInbox(){try{window.parent.postMessage({source:'matflow',type:'open-inbox'},'*');}catch(e){}}\nfunction updateInboxBadge(){\n const list=materials.filter(m=>m.stock<=0);\n const lowList=materials.filter(m=>m.stock>0&&m.stock<=m.minThreshold);\n try{window.parent.postMessage({source:'matflow',type:'inbox-count',count:list.length,items:list.map(m=>({id:m.id,name:m.name,sku:m.sku,unit:m.unit})),lowItems:lowList.map(m=>({id:m.id,name:m.name,sku:m.sku,unit:m.unit,stock:m.stock,min:m.minThreshold}))},'*');}catch(e){}\n}\ntry{\n window.addEventListener('message',function(e){\n  if(e.data&&e.data.source==='ad2006host'&&e.data.type==='restock')openMovementModalWithMat(e.data.id,'IN');\n  if(e.data&&e.data.source==='ad2006host'&&e.data.type==='switch-tab'&&$('page-'+e.data.tab))switchTab(e.data.tab);\n });\n}catch(e){}\n\n// ================= TABS =================\nfunction switchTab(tab){\n document.querySelectorAll('.page-content').forEach(e=>e.classList.add('hidden'));\n const p=$('page-'+tab);if(p)p.classList.remove('hidden');\n document.querySelectorAll('#nav-tabs .nav-btn').forEach(b=>{b.classList.remove('border-black','text-black');b.classList.add('border-transparent','text-slate-500','hover:text-slate-800');});\n const a=$('tab-'+tab);if(a){a.classList.add('border-black','text-black');a.classList.remove('border-transparent','text-slate-500','hover:text-slate-800');}\n const h=$('hdr-alerts ials_Report_${new Date().toISOString().slice(0,10)}.csv`);\n}\nfunction downloadCSV(csv,filename){\n const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement(\"a\");\n a.href=URL.createObjectURL(blob);a.download=filename;a.style.display='none';\n document.body.appendChild(a);a.click();document.body.removeChild(a);\n}\n\n// ================= EXTRA FEATURES =================\nlet matSort={key:null,dir:1};\nfunction sortMaterials(k){if(matSort.key===k)matSort.dir*=-1;else{matSort.key=k;matSort.dir=1;}renderMaterialsTable();}\nfunction setCurrency(c){currency=c;try{localStorage.setItem('matflow_currency',c);}catch(e){}refreshAllViews();}\nconst csvQ=v=>`\"${String(v==null?'':v).replace(/\"/g,'\"\"')}\"`;\n\nfunction usageStats(m){\n const cutoff=Date.now()-30*86400000;\n const used=movements.filter(x=>x.materialId===m.id&&x.type==='OUT'&&new Date(x.date).getTime()>=cutoff).reduce((a,x)=>a+x.qty,0);\n const daily=used/30;\n return {used,daily,days:daily>0?Math.floor(m.stock/daily):null};\n}\nfunction suggestedQty(m){return Math.max(0,num(m.minThreshold*2-m.stock));}\nfunction usageLine(m){\n const u=usageStats(m);\n const d=m.stock<=0?'Out of stock':u.days===null?'No usage in the last 30 days':`About ${u.days} day${u.days===1?'':'s'} of stock left`;\n return `<p class=\"text-[11px] text-slate-500 mt-1\">${d}${m.stock<=m.minThreshold?` &middot; Suggested order: <b>${suggestedQty(m)} ${escapeHtml(m.unit)}<\/b>`:''}<\/p>`;\n}\n\nfunction openMaterialHistory(id){\n const m=materials.find(x=>x.id===id);if(!m)return;\n $('modal-matview-title').textContent=`${m.name} (${m.sku})`;\n const u=usageStats(m),list=movements.filter(x=>x.materialId===id).sort((a,b)=>new Date(b.date)-new Date(a.date));\n const tin=list.filter(x=>x.type==='IN').reduce((a,x)=>a+x.qty,0),tout=list.filter(x=>x.type==='OUT').reduce((a,x)=>a+x.qty,0);\n const stat=(l,v)=>`<div class=\"bg-slate-50 border border-slate-200 rounded-xl p-3\"><p class=\"text-[10px] uppercase font-bold text-slate-400\">${l}<\/p><p class=\"text-sm font-bold text-slate-800\">${v}<\/p><\/div>`;\n const rows=list.length?list.map(x=>{\n  const sign=x.type==='IN'?'+':x.type==='OUT'?'-':'';\n  return `<tr><td class=\"px-4 py-2 text-xs whitespace-nowrap\">${formatDateTime(x.date)}<\/td><td class=\"px-4 py-2 text-xs font-bold\">${x.type}<\/td><td class=\"px-4 py-2 text-xs text-right font-semibold\">${sign}${x.qty} ${escapeHtml(m.unit)}<\/td><td class=\"px-4 py-2 text-xs\">${escapeHtml(partyOf(x))}<\/td><td class=\"px-4 py-2 text-xs text-slate-500\">${escapeHtml(x.person||x.ref||'-')}<\/td><\/tr>`;\n }).join(''):`<tr><td colspan=\"5\" class=\"px-4 py-8 text-center text-slate-400 text-xs\">No movements recorded for this material.<\/td><\/tr>`;\n $('matview-body').innerHTML=`<div class=\"p-5 grid grid-cols-2 sm:grid-cols-4 gap-3\">\n  ${stat('In stock',`${m.stock} ${escapeHtml(m.unit)}`)}${stat('Stock value',money(m.stock*(m.cost||0)))}\n  ${stat('Used, last 30 days',`${num(u.used)} ${escapeHtml(m.unit)}`)}${stat('Stock lasts',u.days===null?'No recent usage':u.days+' days')}\n  ${stat('Total received',`${num(tin)} ${escapeHtml(m.unit)}`)}${stat('Total issued',`${num(tout)} ${escapeHtml(m.unit)}`)}\n  ${stat('Min level',`${m.minThreshold} ${escapeHtml(m.unit)}`)}${stat('Location',escapeHtml(m.location||'-'))}<\/div>\n  <div class=\"max-h-72 overflow-y-auto custom-scrollbar\"><table class=\"w-full text-sm text-left text-slate-600\">\n  <thead class=\"text-xs uppercase bg-slate-100 text-slate-600 sticky top-0\"><tr><th class=\"px-4 py-2\">Date<\/th><th class=\"px-4 py-2\">Type<\/th><th class=\"px-4 py-2 text-right\">Qty<\/th><th class=\"px-4 py-2\">Supplier / Dept<\/th><th class=\"px-4 py-2\">Person / Ref<\/th><\/tr><\/thead>\n  <tbody class=\"divide-y divide-slate-100\">${rows}<\/tbody><\/table><\/div>`;\n $('modal-matview').classList.remove('hidden');\n}\nfunction closeMaterialHistory(){$('modal-matview').classList.add('hidden');}\n\nfunction deleteMaterial(id){\n const m=materi d><td class=\"px-5 py-3\"><span class=\"px-2 py-0.5 rounded-full text-xs font-semibold ${bad?'bg-rose-100 text-rose-700':'bg-brand-100 text-brand-700'}\">${escapeHtml(m.status)}<\/span><\/td><td class=\"px-5 py-3 text-xs ${d!==null&&d<0?'text-rose-600 font-bold':'text-slate-600'}\">${when}${m.nextMaintenance?' ('+formatDateShort(m.nextMaintenance)+')':''}<\/td><\/tr>`;\n }).join(''):`<tr><td colspan=\"4\" class=\"px-5 py-6 text-center text-slate-400 text-xs\">All machines are running and nothing is due this week.<\/td><\/tr>`;\n}\n\n// ---------- CSV import / export ----------\nfunction parseCSV(t){\n const rows=[];let r=[],f='',q=false;\n for(let i=0;i<t.length;i++){\n  const c=t[i];\n  if(q){if(c==='\"'){if(t[i+1]==='\"'){f+='\"';i++;}else q=false;}else f+=c;}\n  else if(c==='\"')q=true;\n  else if(c===','){r.push(f);f='';}\n  else if(c==='\\n'||c==='\\r'){if(c==='\\r'&&t[i+1]==='\\n')i++;r.push(f);f='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[];}\n  else f+=c;\n }\n r.push(f);if(r.some(x=>x.trim()!==''))rows.push(r);\n return rows;\n}\nfunction downloadImportTemplate(){\n downloadCSV(\"SKU,Material Name,Category,Location,Unit,Current Stock,Min Threshold,Unit Cost\\nRM-EXM-001,Example Material,Metals,Rack A1,Kg,100,20,12.5\\n\",\"Materials_Import_Template.csv\");\n}\nfunction importMaterialsCSV(e){\n const f=e.target.files[0];if(!f)return;\n const r=new FileReader();\n r.onload=()=>{\n  try{\n   const rows=parseCSV(String(r.result).replace(/^\\uFEFF/,''));\n   if(rows.length&&/^sku/i.test((rows[0][0]||'').trim()))rows.shift();\n   const units=['Kg','Liters','Meters','Pieces','Sheets','Bags','Rolls','Cubit','Board'];\n   let add=0,upd=0,skip=0;\n   rows.forEach((c,i)=>{\n    const sku=(c[0]||'').trim(),name=(c[1]||'').trim();\n    if(!sku||!name){skip++;return;}\n    const unit=units.find(u=>u.toLowerCase()===(c[4]||'').trim().toLowerCase())||'Pieces';\n    const rec={sku,name,category:(c[2]||'').trim(),location:(c[3]||'').trim(),unit,stock:parseFloat(c[5])||0,minThreshold:parseFloat(c[6])||0,cost:parseFloat(c[7])||0};\n    const ex=materials.find(m=>m.sku.toLowerCase()===sku.toLowerCase());\n    if(ex){\n     if(ex.stock!==rec.stock)movements.push({id:'m_imp_'+Date.now()+'_'+i,date:new Date().toISOString(),materialId:ex.id,type:'ADJUST',qty:rec.stock,ref:'CSV import',notes:'Stock set by CSV import',department:'',person:''});\n     Object.assign(ex,rec);upd++;\n    }else{materials.push({id:Date.now().toString()+'_'+i,...rec});add++;}\n   });\n   saveData();refreshAllViews();showToast(`Import done: ${add} added, ${upd} updated, ${skip} skipped`,\"success\");\n  }catch(err){showToast(\"Could not read that CSV\",\"error\");}\n };\n r.readAsText(f);e.target.value='';\n}\nfunction exportSuppliersToCSV(){\n let csv=\"Supplier,Contact,Phone,Email,Address,Deliveries,Total Value Supplied,Last Delivery\\n\";\n suppliers.forEach(s=>{\n  const ins=movements.filter(m=>m.type==='IN'&&m.supplierId===s.id);\n  const val=ins.reduce((a,m)=>a+movValue(m),0),last=ins.reduce((a,m)=>!a||new Date(m.date)>new Date(a)?m.date:a,null);\n  csv+=[csvQ(s.name),csvQ(s.contact),csvQ(s.phone),csvQ(s.email),csvQ(s.address),ins.length,val,csvQ(last?formatDateShort(last):'')].join(',')+\"\\n\";\n });\n downloadCSV(csv,`Suppliers_${new Date().toISOString().slice(0,10)}.csv`);\n}\nfunction exportMachinesToCSV(){\n let csv=\"Asset Tag,Machine,Department,Status,Last Maintenance,Next Maintenance\\n\";\n machines.forEach(m=>{\n  const recs=maintenanceRecords.filter(r=>r.machineId===m.id).sort((a,b)=>new Date(b.date)-new Date(a.date));\n  csv+=[csvQ(m.assetTag),csvQ(m.name),csvQ(m.dept),csvQ(m.status),csvQ(recs.length?recs[0].date:''),csvQ(m.nextMaintenance||'')].join(',')+\"\\n\";\n });\n downloadCSV(csv,`Machines_${new Date().toISOString().slice(0,10)}.csv`);\n}\nfunction exportReorderCSV(){\n const list=materials.filter(m=>m.stock<=m.minThreshold);\n if(!list.length){showToast(\"Nothing needs reordering\",\"info\");return;}\n let csv=\"SKU,Material,Unit,Current Stock,Min Level,Suggested Order Qty,Estimated Cost,Last Supplier\\n\";\n list.forEach(m=>{\n  const lastIn=movements.filter(x=>x.materialId===m.id&&x.type==='IN').sort((a,b)=>new Date(b.date)-new Date(a.date))[0];\n  const q=suggestedQty(m);\n  csv+=[csvQ(m.sku),csvQ(m.name),csvQ(m.unit),m.stock,m.minThreshold,q,num(q*(m.cost||0)),csvQ(lastIn?supName(lastIn.supplierId)||'':'')].join(',')+\"\\n\";\n });\n downloadCSV(csv,`Reorder_List_${new Date().toISOString().slice(0,10)}.csv`);\n}\n// ================= OPTIONS MENU =================\nfunction closeOptions(){const m=$('options-menu'),b=$('btn-options');if(m)m.classList.add('hidden');if(b)b.setAttribute('aria-expanded','false');}\nfunction toggleOptions(e){\n if(e)e.stopPropagation();\n const m=$('options-menu'),b=$('btn-options'),open=m.classList.contains('hidden');\n m.classList.toggle('hidden',!open);b.setAttribute('aria-expanded',open?'true':'false');\n}\nfunction optRun(fn){closeOptions();fn();}\ndocument.addEventListener('click',e=>{const w=$('options-wrap');if(w&&!w.contains(e.target))closeOptions();});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')closeOptions();});\n// ================= ACTIONS TRIGGERED FROM THE MAIN APP HEADER (Options menu) =================\nwindow.__invAction=function(a){\n try{\n  const M={alerts:()=>switchTab('levels'),stock_in:()=>openMovementModal('IN'),stock_out:()=>openMovementModal('OUT'),\n   export_materials:exportMaterialsToCSV,import_materials:()=>$('import-materials-file').click(),template:downloadImportTemplate,\n   export_movements:exportMovementsToCSV,export_suppliers:exportSuppliersToCSV,export_machines:exportMachinesToCSV,export_reorder:exportReorderCSV,\n   print:()=>window.print(),backup:backupData,restore:()=>$('restore-file').click()};\n  if(M[a])M[a]();\n }catch(err){console.error(err);}\n};\nwindow.addEventListener('message',function(e){if(e.data&&e.data.source==='ad2006host'&&e.data.type==='run')window.__invAction(e.data.action);});\n<\/script>\n<         // ==========================================
        // BACK-BUTTON NAVIGATION (single-page app)
        // Makes the phone/browser Back button step back through the screens, tabs
        // and pop-ups the person visited, instead of closing the page.
        // ==========================================
        const NavBack = (() => {
          let layers = [];          // { depth, undo, alive }
          let depth = 0;            // index of the history entry we are on (0 = entry the page was opened on)
          let inited = false;
          let gestureSeen = false;
          let exitArmedUntil = 0;
          let toastEl = null, toastTimer = null;

          const showToast = (msg) => {
            try {
              if (!toastEl) {
                toastEl = document.createElement('div');
                toastEl.setAttribute('role', 'status');
                toastEl.style.cssText = 'position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:rgba(15,23,42,0.95);color:#fff;padding:10px 18px;border-radius:9999px;font:600 13px/1.2 system-ui,sans-serif;z-index:99999;box-shadow:0 8px 24px rgba(0,0,0,0.3);pointer-events:none;transition:opacity .25s;opacity:0;white-space:nowrap;';
                document.body.appendChild(toastEl);
              }
              toastEl.textContent = msg;
              toastEl.style.opacity = '1';
              clearTimeout(toastTimer);
              toastTimer = setTimeout(() => { if (toastEl) toastEl.style.opacity = '0'; }, 2300);
            } catch (e) { /* ignore */ }
          };

          // Browsers ignore history entries created before the person has touched the page,
          // so the guard entry is created on the first tap / key press.
          const ensureInit = () => {
            if (inited || !gestureSeen) return;
            try {
              window.history.replaceState({ adDepth: 0 }, '');
              window.history.pushState({ adDepth: 1 }, '');
              depth = 1;
              inited = true;
            } catch (e) { inited = false; }
          };
          const onGesture = () => { gestureSeen = true; ensureInit(); };
          ['pointerup', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, onGesture, true));

          const push = (undo) => {
            const layer = { depth: 0, undo, alive: false };
            ensureInit();
            if (!inited) return layer;
            try {
              window.history.pushState({ adDepth: depth + 1 }, '');
              depth += 1;
              layer.depth = depth;
              layer.alive = true;
              layers.push(layer);
            } catch (e) { /* history unavailable: Back simply behaves as before */ }
            return layer;
          };
          const kill = (layer) => { if (layer) layer.alive = false; };
          const reset = () => { layers.forEach(l => { l.alive = false; }); };

          window.addEventListener('popstate', (e) => {
            if (!inited) return;
            const target = (e.state && typeof e.state.adDepth === 'number') ? e.state.adDepth : 0;
            if (target > depth) { depth = target; return; } // Forward button: nothing to redo
            const popped = layers.filter(l => l.depth > target);
            layers = layers.filter(l => l.depth <= target);
            depth = target;
            const live = popped.filter(l => l.alive).sort((a, b) => b.depth - a.depth);
            if (live.length > 0) {
              live.forEach(l => { l.alive = false; try { l.undo(); } catch (err) { console.error(err); } });
              return;
            }
            // Nothing visible to undo: skip over entries whose screen was already closed
            if (target >= 2) { try { window.history.back(); } catch (err) { /* ignore */ } return; }
            if (target === 1) { exitArmedUntil = Date.now() + 2500; showToast('Press Back again to exit'); return; }
            // target === 0: the very first entry
            if (Date.now() < exitArmedUntil) {
              exitArmedUntil = 0;
              try { window.history.back(); } catch (err) { /* ignore */ }
              return;
            }
            exitArmedUntil = Date.now() + 2500;
            showToast('Press Back again to exit');
            try { window.history.pushState({ adDepth: 1 }, ''); depth = 1; } catch (err) { /* ignore */ }
          });

          return { push, kill, reset };
        })();

        // State whose changes count as "going somewhere": Back returns to the previous value.
        function useNavState(initial) {
          const [value, setValue] = useState(initial);
          const ref = useRef(initial);
          const layersRef = useRef([]);
          const set = React.useCallback((next) => {
            const cur = ref.current;
            const nv = typeof next === 'function' ? next(cur) : next;
            if (nv === cur) return;
            ref.current = nv;
            layersRef.current.push(NavBack.push(() => { ref.current = cur; setValue(cur); }));
            setValue(nv);
          }, []);
          const setRaw = React.useCallback((nv) => { ref.current = nv; setValue(nv); }, []);
          useEffect(() => () => { layersRef.current.forEach(NavBack.kill); }, []);
          return [value, set, setRaw];
        }

        // A pop-up / sub-screen: while it is open, Back closes it.
        function useBackLayer(isOpen, onClose) {
          const closeRef = useRef(onClose);
          closeRef.current = onClose;
          useEffect(() => {
            if (!isOpen) return;
            const layer = NavBack.push(() => closeRef.current());
            return () => NavBack.kill(layer);
          }, [isOpen]);
        }

          ['Reports', [['export_movements', 'Export movements (CSV)', 'fa-right-left'], ['export_suppliers', 'Export suppliers (CSV)', 'fa-truck-field'], ['export_machines', 'Export machines (CSV)', 'fa-cogs'], ['export_reorder', 'Reorder list (CSV)', 'fa-cart-flatbed'], ['print', 'Print this page', 'fa-print']]],

        // ==========================================
